<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VIMECO S.A. — Archivo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    /* Estética de la pantalla Archivo de Leva: sus fuentes, tonos y tarjetas,
       sólo dentro de la página (el header sigue siendo el de VIMECO). */
    @font-face { font-family: 'Geist'; src: url('assets/fonts/geist.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('assets/fonts/plus-jakarta-sans.woff2') format('woff2'); font-weight: 200 800; font-style: normal; font-display: swap; }
    .ar-page {
      --surface: #FFFFFF; --sunk: #F3F0FD; --ink: #231C4A; --ink-2: #6B658F; --line: #E8E4F7;
      --menta-bg: #DDF5E8; --menta-fg: #1D6B45; --durazno-bg: #FFE7D6; --durazno-fg: #9A4A16;
      --rosa-bg: #FBE1E6; --rosa-fg: #A0283E; --fac-bg: #F3E6FB; --fac-fg: #7A3A9E;
      --arc-bg: #E3E5FC; --arc-fg: #3B44A8;
      --shadow-leva: 0 1px 2px rgba(56,40,140,.06), 0 8px 22px -12px rgba(56,40,140,.28);
      --font-texto: 'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-display: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
      /* Archivo lleva el color de su tarjeta del menú (data-tone="indigo"). */
      --tono: #3B44A8; --tono-2: #5B63C9; --tono-soft: #E3E5FC;
    }
    .ar-page { max-width: 1240px; margin: 0 auto; padding: 1rem 1rem 5rem; font-family: var(--font-texto); color: var(--ink); }
    .ar-hd { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin: .3rem 0 .9rem; }
    .ar-hd h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; margin: 0; color: var(--ink); }
    .ar-uso { font-size: .82rem; color: var(--ink-2); }

    .ar-tools { display: flex; flex-direction: column; gap: .6rem; margin-bottom: .8rem; }
    .ar-search { display: flex; align-items: center; gap: .5rem; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 0 .85rem; min-height: 46px; }
    .ar-search:focus-within { border-color: var(--tono-2); box-shadow: 0 0 0 4px rgba(59,68,168,.14); }
    .ar-search .icon { width: 17px; height: 17px; color: var(--ink-2); flex: none; }
    .ar-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 1rem; color: var(--ink); }
    .ar-seg { display: flex; background: var(--sunk); border-radius: 12px; padding: 3px; }
    .ar-seg button { flex: 1; border: 0; background: transparent; font: inherit; font-size: .84rem; font-weight: 600; color: var(--ink-2); padding: .45rem .8rem; border-radius: 9px; cursor: pointer; white-space: nowrap; }
    .ar-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-leva); }
    .ar-seg--sm button { font-size: .76rem; padding: .3rem .6rem; }
    @media (min-width: 720px) { .ar-tools { flex-direction: row; align-items: center; } .ar-search { flex: 1 1 320px; } .ar-tools .ar-seg { flex: none; } }

    .ar-crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; font-size: .84rem; color: var(--ink-2); margin: 0 0 .7rem; min-height: 1.6rem; }
    .ar-crumbs button { border: 0; background: transparent; font: inherit; color: var(--tono); font-weight: 600; padding: .15rem .35rem; border-radius: 7px; cursor: pointer; }
    .ar-crumbs button:hover { background: var(--tono-soft); }
    .ar-crumbs span { padding: .15rem .35rem; color: var(--ink); font-weight: 600; }
    .ar-crumbs i { font-style: normal; opacity: .55; }

    /* Teléfono: un nivel por vez. Compu: los tres en columnas. */
    .ar-col { display: none; min-width: 0; }
    .ar-cols[data-nivel="1"] #ar-c1, .ar-cols[data-nivel="2"] #ar-c2, .ar-cols[data-nivel="3"] #ar-c3 { display: block; }
    /* En la compu la página ocupa justo el alto de la pantalla debajo del header (60px): la
       página no se desplaza, cada columna (y los resultados de la búsqueda) por dentro. */
    @media (min-width: 960px) {
      .ar-page { display: flex; flex-direction: column; height: calc((100dvh - 60px) / var(--z, 1)); padding-bottom: .75rem; box-sizing: border-box; }
      #ar-cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      #ar-res { flex: 1; min-height: 0; overflow-y: auto; padding: 0 4px 1rem 2px; }
      .ar-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 240px 440px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 16px; }
      .ar-col { display: block !important; position: relative; min-height: 0; overflow-y: auto; padding: 2px 4px 1rem 2px; scrollbar-width: thin; }
      .ar-crumbs { display: none; }
    }
    /* Monitores grandes: la página entera se agranda (como el zoom del navegador) y ocupa el ancho.
       Con zoom, los dvh y los px también se multiplican: por eso la altura de la página divide por --z. */
    @media (min-width: 1400px) {
      .ar-page { --z: 1.15; zoom: var(--z); max-width: 1500px; padding-inline: 1.5rem; }
      .ar-cols { grid-template-columns: 260px 420px minmax(0, 1fr); gap: 20px; }
    }
    @media (min-width: 1700px) { .ar-page { --z: 1.3; } }
    @media (min-width: 2200px) { .ar-page { --z: 1.45; } }

    .ar-lbl { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin: 1rem .2rem .45rem; }
    .ar-lbl:first-child, .ar-abc-w + .ar-lbl { margin-top: .1rem; }
    .ar-lbl i { font-style: normal; font-weight: 500; letter-spacing: 0; text-transform: none; opacity: .85; }

    /* Nivel 1: carpetas */
    .ar-fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
    .ar-fd { display: flex; flex-direction: column; align-items: flex-start; gap: .3rem; min-width: 0; background: var(--surface); border: 0; border-radius: 16px; box-shadow: var(--shadow-leva); padding: .8rem; font: inherit; color: inherit; text-align: left; cursor: pointer; }
    .ar-fd:hover { box-shadow: 0 0 0 1.5px var(--tono-2), var(--shadow-leva); }
    .ar-fd-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--tono-soft); color: var(--tono); }
    .ar-fd-ic .icon { width: 19px; height: 19px; }
    .ar-fd b { font-size: .9rem; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; word-break: break-word; }
    .ar-fd small { font-size: .74rem; color: var(--ink-2); }
    .ar-fd em { font-style: normal; font-size: .72rem; font-weight: 600; color: var(--durazno-fg); }
    .ar-fd em.ok { color: var(--menta-fg); }
    .ar-fd[aria-current="true"] { box-shadow: 0 0 0 2px var(--tono), var(--shadow-leva); }
    .ar-fd { scroll-margin-top: 72px; }

    /* Barra de letras (Por proveedor): reemplaza a la barra de desplazamiento. Riel fino, tirador
       con lo que se ve, letras donde empieza cada inicial (las ubica archivo.js) y la actual
       resaltada; al arrastrar, una burbuja con la letra. Teléfono: borde derecho de la pantalla.
       Compu: dentro de la columna (el envoltorio sticky de alto 0 la deja quieta al scrollear). */
    .ar-abc { position: fixed; right: 0; top: 68px; bottom: 8px; z-index: 5; width: 30px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer; }
    /* Letras a la izquierda (18px); riel y tirador a la derecha, sin pasar por encima de ellas. */
    .ar-abc::before { content: ''; position: absolute; right: 5px; top: 4px; bottom: 4px; width: 2px; border-radius: 2px; background: var(--line); }
    .ar-abc-th { position: absolute; right: 2px; width: 8px; top: 0; border-radius: 4px; background: #C9CDF3; will-change: transform; transition: background .15s; }
    .ar-abc button { position: absolute; left: 0; width: 18px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; font: inherit; font-size: .62rem; font-weight: 700; line-height: 1; color: var(--ink-2); cursor: pointer; isolation: isolate; transition: color .15s; }
    .ar-abc button::before { content: ''; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--tono); transform: scale(0); transition: transform .22s cubic-bezier(.3, 1.6, .5, 1); z-index: -1; }
    .ar-abc button.on { color: #fff; }
    .ar-abc button.on::before { transform: scale(1); }
    .ar-abc button:hover:not(.on) { color: var(--tono); }
    .ar-abc-bu { position: absolute; right: 38px; top: 0; width: 46px; height: 46px; margin-top: -23px; display: grid; place-items: center; border-radius: 50%; background: var(--tono); color: #fff; font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; box-shadow: 0 6px 18px rgba(59,68,168,.35); opacity: 0; transform: scale(.5) translateX(12px); transition: opacity .15s, transform .18s cubic-bezier(.3, 1.4, .5, 1), top .12s ease-out; pointer-events: none; }
    .ar-abc.arrastra .ar-abc-bu { opacity: 1; transform: none; }
    .ar-abc.arrastra .ar-abc-th, .ar-abc:hover .ar-abc-th { background: var(--tono-2); }
    .ar-fgrid--abc, .ar-col--abc .ar-lbl { padding-right: 20px; }
    html.ar-sin-barra { scrollbar-width: none; }
    html.ar-sin-barra::-webkit-scrollbar { display: none; }
    @media (min-width: 960px) {
      .ar-abc-w { position: sticky; top: 0; height: 0; z-index: 2; }
      .ar-abc { position: absolute; top: 4px; bottom: auto; right: -4px; }
      .ar-col--abc { scrollbar-width: none; }
      .ar-col--abc::-webkit-scrollbar { display: none; }
      .ar-fgrid--abc, .ar-col--abc .ar-lbl { padding-right: 30px; }
    }
    @media (min-width: 960px) {
      .ar-fgrid { grid-template-columns: 1fr; gap: .4rem; }
      .ar-fd { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: .65rem; row-gap: 0; align-items: center; padding: .6rem .7rem; border-radius: 12px; }
      .ar-fd-ic { grid-row: span 3; width: 32px; height: 32px; border-radius: 10px; }
      .ar-fd b { min-height: 0; -webkit-line-clamp: 1; }
    }

    /* Filas tipo explorador */
    .ar-rows { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-leva); overflow: hidden; }
    .ar-r { display: flex; align-items: center; gap: .7rem; width: 100%; padding: .65rem .8rem; border: 0; border-top: 1px solid var(--line); background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; }
    .ar-r:first-child { border-top: 0; }
    .ar-r:hover { background: var(--sunk); }
    .ar-r[aria-current="true"] { background: var(--tono-soft); }
    .ar-r-n { flex: none; min-width: 2.9rem; font-weight: 700; font-size: .92rem; font-variant-numeric: tabular-nums; }
    .ar-r-tx { flex: 1; min-width: 0; }
    .ar-r-tx b { display: block; font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ar-r-tx small { display: block; font-size: .75rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .ar-r--oc { align-items: center; padding: .7rem .8rem; }
    .ar-r-l1 { display: flex; align-items: center; flex-wrap: wrap; gap: .15rem .5rem; margin-bottom: .1rem; }
    .ar-r-l1 .ar-r-n { min-width: 0; }
    .ar-r-f { font-size: .72rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .ar-r-m { font-size: .72rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .ar-r-l1 .ar-est { margin-left: 0; }
    .ar-chev { flex: none; width: 15px; height: 15px; color: var(--ink-2); transform: rotate(-90deg); }
    .ar-dots { flex: none; display: flex; gap: 3px; }
    .ar-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #C9CDF3; }
    .ar-dot.on.oc { background: #3B44A8; border-color: #3B44A8; }
    .ar-dot.on.presupuesto { background: #E0884A; border-color: #E0884A; }
    .ar-dot.on.factura { background: #A35BC9; border-color: #A35BC9; }
    .ar-dot.on.remito { background: #2A9A8F; border-color: #2A9A8F; }
    .ar-ley { display: flex; flex-wrap: wrap; gap: .3rem .8rem; font-size: .72rem; color: var(--ink-2); margin: .55rem .3rem 0; }
    .ar-ley span { display: inline-flex; align-items: center; gap: .3rem; }
    .ar-bar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; margin: .2rem 0 .6rem; }
    .ar-tog { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); font: inherit; font-size: .76rem; font-weight: 600; padding: .3rem .7rem; border-radius: 999px; cursor: pointer; }
    .ar-tog[aria-pressed="true"] { background: var(--durazno-bg); border-color: transparent; color: var(--durazno-fg); }
    .ar-est { display: inline-block; font-size: .64rem; font-weight: 700; padding: 0 .4rem; border-radius: 6px; margin-left: .3rem; background: var(--rosa-bg); color: var(--rosa-fg); vertical-align: 1px; }
    .ar-est--pend { background: var(--durazno-bg); color: var(--durazno-fg); }

    /* Cabecera de una carpeta */
    .ar-fh { margin: 0 .2rem .7rem; }
    .ar-fh h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em; line-height: 1.2; margin: 0; word-break: break-word; color: var(--ink); }
    .ar-fh p { margin: .2rem 0 0; font-size: .8rem; color: var(--ink-2); }
    .ar-fh p b { color: var(--ink); font-weight: 600; }
    .ar-acts { display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .7rem; }
    .ar-act { display: inline-flex; align-items: center; gap: .35rem; border: 0; background: var(--surface); box-shadow: var(--shadow-leva); color: var(--tono); font: inherit; font-size: .8rem; font-weight: 600; padding: .5rem .8rem; border-radius: 10px; cursor: pointer; text-decoration: none; }
    .ar-act .icon { width: 15px; height: 15px; }

    /* Tarjeta de entrega: qué llegó y qué falta. Abre el PDF; al lado, el Excel. */
    .ar-ent { --e-fg: #6B658F; --e-bg: var(--sunk); display: flex; gap: .45rem; margin: 0 0 .4rem; }
    .ar-ent--parcial { --e-fg: #9A5B00; --e-bg: #FFF1D9; }
    .ar-ent--completa { --e-fg: var(--menta-fg); --e-bg: var(--menta-bg); }
    .ar-ent--sin { --e-fg: var(--rosa-fg); --e-bg: var(--rosa-bg); }
    .ar-ent-ver { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: .45rem .7rem; text-align: left; border: 0; background: var(--surface); box-shadow: var(--shadow-leva); border-left: 4px solid var(--e-fg); border-radius: 12px; padding: .65rem .8rem; font: inherit; color: var(--ink); cursor: pointer; }
    .ar-ent-ver:hover { background: var(--e-bg); }
    .ar-ent-tx b { display: block; font-size: .9rem; color: var(--e-fg); }
    .ar-ent-tx small { display: block; font-size: .76rem; color: var(--ink-2); margin-top: .1rem; }
    .ar-ent-bar { grid-column: 1 / -1; grid-row: 2; height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
    .ar-ent-bar i { display: block; height: 100%; border-radius: inherit; background: var(--e-fg); }
    .ar-ent-cta { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; font-weight: 700; color: var(--tono); }
    .ar-ent-cta .icon, .ar-ent-xls .icon { width: 15px; height: 15px; }
    .ar-ent-xls { flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; border: 0; background: var(--surface); box-shadow: var(--shadow-leva); border-radius: 12px; padding: 0 .8rem; font: inherit; font-size: .72rem; font-weight: 700; color: var(--menta-fg); cursor: pointer; }
    .ar-ent-xls:hover { background: var(--menta-bg); }

    /* Archivos */
    .ar-item { display: flex; align-items: center; gap: .6rem; padding: .55rem .6rem .55rem .8rem; border-top: 1px solid var(--line); }
    .ar-item:first-child { border-top: 0; }
    .ar-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: .7rem; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 0; }
    .ar-open:disabled { cursor: default; opacity: .7; }
    .ar-tile { flex: none; width: 36px; height: 42px; border-radius: 9px; display: grid; place-items: center; font-size: .62rem; font-weight: 800; letter-spacing: .03em; }
    .ar-tile--pdf { background: var(--rosa-bg); color: var(--rosa-fg); }
    .ar-tile--img { background: var(--menta-bg); color: var(--menta-fg); }
    .ar-tile--xls { background: var(--menta-bg); color: #19645E; }
    .ar-tile--doc { background: #DDEDFF; color: #1E5A94; }
    .ar-tile--otro { background: var(--sunk); color: var(--ink-2); }
    .ar-tipo { display: inline-block; font-size: .68rem; font-weight: 700; padding: .05rem .45rem; border-radius: 6px; margin-right: .35rem; background: var(--tono-soft); color: var(--tono); vertical-align: 1px; }
    .ar-tipo--oc { background: var(--arc-bg); color: var(--arc-fg); }
    .ar-tipo--presupuesto { background: var(--durazno-bg); color: var(--durazno-fg); }
    .ar-tipo--factura { background: var(--fac-bg); color: var(--fac-fg); }
    .ar-tipo--remito { background: #D9F2F0; color: #19645E; }
    .ar-tipo--planilla { background: var(--menta-bg); color: var(--menta-fg); }
    .ar-falta { display: flex; align-items: center; gap: .7rem; width: calc(100% - 1rem); margin: .45rem .5rem; padding: .5rem .6rem; border: 1.5px dashed #C9CDF3; border-radius: 12px; background: transparent; font: inherit; font-size: .84rem; color: var(--ink-2); text-align: left; text-decoration: none; }
    button.ar-falta, a.ar-falta { cursor: pointer; }
    .ar-falta .icon { flex: none; width: 18px; height: 18px; color: var(--tono-2); margin: 0 .5rem 0 .45rem; }
    .ar-falta b { margin-left: auto; color: var(--tono); font-weight: 600; white-space: nowrap; }
    .ar-falta:hover { border-color: var(--tono-2); }
    .ar-falta--info { border-style: solid; border-color: var(--line); }
    .ar-nota { font-size: .76rem; color: var(--ink-2); margin: .55rem .3rem 0; }
    .ar-sinasig { margin: .9rem .2rem 0; }
    .ar-sinasig summary { display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--ink-2); cursor: pointer; list-style: none; padding: .2rem 0; }
    .ar-sinasig summary::-webkit-details-marker { display: none; }
    .ar-sinasig summary .icon { width: 14px; height: 14px; flex: none; }
    .ar-sinasig[open] summary { color: var(--ink); font-weight: 600; }
    .ar-sinasig .ar-nota { margin: .2rem 0 .5rem; }
    .ar-asig { flex: none; border: 0; background: var(--tono-soft); color: var(--tono); font: inherit; font-size: .74rem; font-weight: 700; padding: .35rem .6rem; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .ar-asig:hover { background: var(--tono); color: #fff; }

    .ar-mas { display: block; margin: 1rem auto 0; border: 1.5px solid var(--line); background: var(--surface); color: var(--tono); font: inherit; font-weight: 600; font-size: .88rem; padding: .55rem 1.1rem; border-radius: 12px; cursor: pointer; }
    .ar-ph { color: var(--ink-2); font-size: .9rem; text-align: center; padding: 3rem 1rem; }
    .ar-vacio { text-align: center; color: var(--ink-2); padding: 3rem 1rem; font-size: .93rem; display: flex; flex-direction: column; align-items: center; gap: .7rem; }
    .ar-vacio .icon { width: 34px; height: 34px; color: var(--tono-2); }
    .ar-hl { background: #FFF1A8; color: inherit; border-radius: 3px; }

    /* Visor */
    .vis { position: fixed; inset: 0; z-index: 10000; background: #16112E; display: flex; flex-direction: column; color: #fff; font-family: var(--font-texto); animation: visIn .18s ease-out; }
    @keyframes visIn { from { opacity: 0; } to { opacity: 1; } }
    .vis-hd { display: flex; align-items: center; gap: .5rem; padding: .6rem .75rem; padding-top: max(.6rem, env(safe-area-inset-top)); background: rgba(22,17,46,.92); border-bottom: 1px solid rgba(255,255,255,.08); }
    .vis-t { flex: 1; min-width: 0; }
    .vis-tipo { flex: none; font-size: 1.05rem; font-weight: 800; letter-spacing: .01em; padding: .5rem 1.05rem; border-radius: 999px; background: #E4E0FA; color: #3B2F86; white-space: nowrap; }
    /* Los tonos de .ar-tipo, escritos acá: el visor cuelga de body, fuera de .ar-page. */
    .vis-tipo--oc { background: #E3E5FC; color: #3B44A8; }
    .vis-tipo--presupuesto { background: #FFE7D6; color: #9A4A16; }
    .vis-tipo--factura { background: #F3E6FB; color: #7A3A9E; }
    .vis-tipo--remito { background: #D9F2F0; color: #19645E; }
    .vis-tipo--planilla { background: #DDF5E8; color: #1D6B45; }
    /* En el teléfono la pastilla y los botones van arriba y el nombre abajo, entero. */
    @media (max-width: 640px) {
      .vis-hd { flex-wrap: wrap; }
      .vis-tipo { margin-right: auto; font-size: .95rem; padding: .45rem .9rem; }
      .vis-t { order: 10; flex-basis: 100%; }
    }
    .vis-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(22,17,46,.82); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
    .vis-nav--prev { left: 12px; }
    .vis-nav--next { right: 12px; }
    .vis-nav .icon { width: 22px; height: 22px; }
    .vis-nav:hover:not(:disabled) { background: rgba(60,50,120,.95); }
    .vis-nav:disabled { opacity: .3; cursor: default; }
    .vis-t b { display: block; font-size: .95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vis-t span { font-size: .75rem; color: #B9B2E0; }
    .vis-b { flex: none; width: 40px; height: 40px; border: 0; border-radius: 12px; background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; cursor: pointer; text-decoration: none; }
    .vis-b:hover { background: rgba(255,255,255,.16); }
    .vis-b .icon { width: 19px; height: 19px; }
    .vis-b:disabled { opacity: .45; cursor: progress; }
    .vis-c { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 12px 12px 72px; touch-action: pan-x pan-y; }
    /* margin auto (y no align-items: center) para que, con zoom, se pueda scrollear hasta el borde izquierdo */
    .vis-c > * { flex: none; margin-inline: auto; }
    .vis-c > img:only-child, .vis-c > .vis-p:only-child { margin-block: auto; }
    .vis-c img { display: block; border-radius: 6px; background: #fff; user-select: none; -webkit-user-drag: none; }
    .vis-p { background: #fff; border-radius: 4px; box-shadow: 0 4px 18px rgba(0,0,0,.4); overflow: hidden; }
    .vis-p canvas { display: block; width: 100%; height: 100%; }
    .vis-zm { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 14px; background: rgba(22,17,46,.88); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 6px 20px rgba(0,0,0,.35); }
    .vis-zm button { width: 40px; height: 36px; border: 0; border-radius: 10px; background: transparent; color: #fff; font: inherit; font-size: 1.25rem; line-height: 1; cursor: pointer; }
    .vis-zm button[data-z="0"] { width: auto; min-width: 60px; font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .vis-zm button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
    .vis-zm button:disabled { opacity: .35; cursor: default; }
    .vis-msg { margin: auto; text-align: center; color: #D8D3F5; font-size: .92rem; display: flex; flex-direction: column; align-items: center; gap: .9rem; padding: 1rem; }
    .vis-bar { width: 180px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
    .vis-bar i { display: block; height: 100%; width: 30%; background: #8B7CF6; animation: visCarga 1.1s ease-in-out infinite; }
    @keyframes visCarga { from { transform: translateX(-100%); } to { transform: translateX(330%); } }
    .vis-dl { border: 0; border-radius: 12px; background: #8B7CF6; color: #fff; font: inherit; font-weight: 600; padding: .7rem 1.2rem; cursor: pointer; text-decoration: none; }
  </style>
</head>

<header class="app-header">
  <div class="header-brand u-pointer" onclick="window.location.href='menu.html'">
    <img src="assets/logo_claro.png" id="header-logo" alt="VIMECO" class="header-logo"
      onerror="this.style.display='none';document.getElementById('header-logo-fb').style.display='inline'">
    <span id="header-logo-fb" class="header-logo-fallback" style="display:none">VIMECO S.A.</span>
    <span class="header-title">Archivo</span>
  </div>
  <div class="header-user">
    <div class="user-badge"><span id="hdr-name">—</span></div>
    <button class="btn btn-sm btn-outline btn-icon" aria-label="Volver" title="Volver" onclick="window.location.href='menu.html'"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
  </div>
</header>

<main class="ar-page">
  <div class="ar-hd">
    <h1>Archivo</h1>
    <span class="ar-uso" id="ar-uso"></span>
  </div>

  <div id="ar-cuerpo" class="hidden">
    <div class="ar-tools">
      <label class="ar-search">
        <span id="ar-ic-search"></span>
        <input type="search" id="ar-q" placeholder="Buscar por N° de OC, proveedor, obra, artículo o archivo…" autocomplete="off">
      </label>
      <div class="ar-seg" id="ar-dim" role="group" aria-label="Ordenar carpetas">
        <button type="button" data-dim="mes" aria-pressed="false">Por mes</button>
        <button type="button" data-dim="obra" aria-pressed="false">Por obra</button>
        <button type="button" data-dim="prov" aria-pressed="false">Por proveedor</button>
      </div>
    </div>
    <nav class="ar-crumbs" id="ar-crumbs" aria-label="Dónde estás"></nav>
    <div class="ar-cols" id="ar-cols" data-nivel="1">
      <section class="ar-col" id="ar-c1"></section>
      <section class="ar-col" id="ar-c2"></section>
      <section class="ar-col" id="ar-c3"></section>
    </div>
    <div id="ar-res" class="hidden"></div>
  </div>
  <div id="ar-estado" class="ar-vacio">Cargando…</div>
  <input type="file" id="ar-file" class="hidden" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx">
</main>

<!-- ===== MODAL: Ficha de la OC (la misma que el Historial; acá sin PDF) ===== -->
<div class="modal-overlay hidden" id="modal-preview">
  <div class="modal foc-modal">
    <div class="foc-head">
      <div class="foc-head-l">
        <span class="foc-kicker">Orden de compra</span>
        <span class="foc-nro" id="preview-title">—</span>
        <div class="foc-chips" id="preview-chips"></div>
      </div>
      <div class="foc-head-r">
        <span class="foc-kicker">Total</span>
        <span class="foc-total" id="preview-total">—</span>
      </div>
      <button class="foc-x" id="modal-preview-close" aria-label="Cerrar"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="preview-body"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
