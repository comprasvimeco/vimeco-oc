<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO S.A. — Novedades</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    /* ---- Cabecera: título, pastilla de sin ver y "Ver todas" en un renglón ---- */
    .act-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .9rem; }
    .act-head h1 { font-size: 1.45rem; font-weight: 700; color: var(--primary-dark); line-height: 1.2; white-space: nowrap; }
    .act-unseen { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .65rem; border-radius: 999px;
      background: #fde6e6; color: #b02a2a; font-size: .76rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .act-unseen::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #d64545; }
    /* La pastilla filtra: tocándola quedan sólo las sin ver (la cruz la apaga). */
    button.act-unseen { border: 1px solid transparent; font-family: inherit; cursor: pointer; }
    button.act-unseen:hover { border-color: #f0b4b4; }
    .act-unseen.on { background: #d64545; color: #fff; }
    .act-unseen.on::before { background: #fff; }
    .act-unseen .icon { width: 12px; height: 12px; }
    .act-head .act-ver-todas { margin-left: auto; font-size: .72rem; padding: .26rem .65rem; white-space: nowrap; }
    .act-head .act-ver-todas .icon { width: 12px; height: 12px; }
    .act-search { width: 100%; border-radius: 12px; margin-bottom: .7rem; }

    /* ---- Tipo y período: desplegables-pastilla (.act-dd/.act-pick/.act-menu en styles.css, los comparte Historial) ---- */
    .act-bar { display: flex; align-items: center; gap: .5rem; }
    .act-bar .hist-count { margin-left: auto; font-size: .78rem; }

    /* ---- Alerta: OC sin respaldo en Drive ---- */
    /* Rojo: no es una novedad más del feed, es una OC cuyo PDF no está
       archivado. Por eso vive arriba de los filtros y no dentro de la lista. */
    .act-alert { background: #fef4f4; border: 1px solid #f3c9c9; border-radius: var(--radius);
      padding: .85rem 1rem; margin-bottom: 1rem; }
    .act-alert-hd { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      font-size: .85rem; font-weight: 600; color: #a12b2b; margin-bottom: .2rem; }
    .act-alert-sub { font-size: .78rem; color: #8a4b4b; margin-bottom: .7rem; }
    .act-alert-list { display: flex; flex-wrap: wrap; gap: .4rem; }
    .act-alert-oc { display: flex; align-items: center; gap: .45rem; background: var(--white);
      border: 1px solid #eec9c9; border-radius: 999px; padding: .3rem .6rem; font-size: .78rem; }
    .act-alert-oc b { font-weight: 600; }
    .act-alert-oc span { color: var(--gray-500); }
    .act-alert-actions { margin-top: .8rem; }

    /* ---- OC esperando autorización ---- */
    /* Azul y no rojo: nada falló, hay algo que alguien tiene que resolver.
       Tampoco ámbar, que ya lo usa el banner de "sin ver". */
    .act-pend { background: #eef4ff; border: 1px solid #c7d9f5; border-radius: var(--radius);
      padding: .85rem 1rem; margin-bottom: 1rem; }
    .act-pend-hd { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
      font-size: .85rem; font-weight: 600; color: var(--primary, #1a3a5c); margin-bottom: .2rem; }
    .act-pend-sub { font-size: .78rem; color: #4a6489; margin-bottom: .7rem; }
    .act-pend-list { display: flex; flex-wrap: wrap; gap: .4rem; }
    .act-pend-oc { display: flex; align-items: center; gap: .45rem; background: var(--white);
      border: 1px solid #d3e0f5; border-radius: 999px; padding: .3rem .6rem; font-size: .78rem; }
    .act-pend-oc b { font-weight: 600; }
    .act-pend-oc span { color: var(--gray-500); }
    .act-pend-actions { margin-top: .8rem; }

    /* ---- Filtros + fechas a medida (sólo con "Elegir fechas…") ---- */
    .act-dates { margin: 0 0 .9rem; padding-bottom: .8rem; border-bottom: 1px solid var(--gray-200); }
    .act-day {
      font-size: .78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: var(--gray-500); margin: 1.1rem .15rem .45rem;
    }
    .act-day:first-of-type { margin-top: .3rem; }
    .act-card { padding: .7rem .85rem; transition: background .2s; }
    .act-card-unseen { border-left: 3px solid var(--primary, #1a3a5c); }
    .act-card-seen { background: #eef7f1; }
    .act-card-seen .act-title, .act-card-seen .act-detalle { color: var(--gray-500); }
    .act-row { display: flex; align-items: flex-start; gap: .7rem; }
    .act-badge {
      display: inline-flex; align-items: center; gap: .3rem; flex: 0 0 auto;
      font-size: .72rem; font-weight: 700; padding: .25rem .5rem; border-radius: 6px;
      white-space: nowrap;
    }
    .act-badge .icon { width: 13px; height: 13px; }
    .act-t-oc      { background: #e6f0fb; color: #1a3a5c; }
    .act-t-adjunto { background: #e9f7ee; color: #1b6b3a; }
    .act-t-caja    { background: #fdeede; color: #8a4b00; }
    .act-t-remito  { background: #f0ecfb; color: #4c3a8a; }
    .act-t-factura { background: #fdf0f3; color: #8a2a45; }
    .act-body { flex: 1 1 auto; min-width: 0; }
    .act-title {
      font-weight: 600; font-size: .92rem; color: var(--gray-800);
      display: flex; align-items: center; gap: .4rem;
    }
    .act-detalle { font-size: .82rem; color: var(--gray-600); margin-top: .1rem; }
    .act-meta { font-size: .74rem; color: var(--gray-500); margin-top: .15rem; }
    /* Acciones: las pastillas de las fichas, en un renglón al pie de la tarjeta.
       Borrar va aparte, a la derecha, como Eliminar en la ficha de Reportes. */
    .act-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem;
      margin-top: .6rem; padding-top: .55rem; border-top: 1px solid var(--gray-100); }
    .act-actions .foc-btn { font-size: .76rem; padding: .35rem .8rem; white-space: nowrap; }
    .act-actions .foc-btn .icon { width: 13px; height: 13px; }
    .act-actions .act-del { margin-left: auto; }
    .act-actions .act-anular { margin-left: auto; }
    .act-actions .act-anular + .act-del { margin-left: 0; }
    /* La pastilla del tipo elegido toma el color de su etiqueta (act-t-*). */
    .act-pick[class*="act-t-"] { border-color: transparent; }
    .foc-btn--fact { background: #f1e8fb; color: #6b3fa0; }   /* los tonos de las pastillas del Historial */
    .foc-btn--rem  { background: #fbeedd; color: #8a4f0d; }
    .act-seen-label {
      display: inline-flex; align-items: center; gap: .25rem; padding: 0 .3rem;
      font-size: .74rem; font-weight: 700; color: #1b6b3a;
    }
    .act-seen-label .icon { width: 13px; height: 13px; }
    .act-card-seen .act-actions { border-top-color: #d6ebdd; }
    /* ---- Factura y remitos de la OC en la tarjeta ---- */
    .act-card .hist-docs { margin-top: .35rem; }
    .act-card .hist-doc-list { margin-top: .35rem; }
    /* Los chips de los paneles de arriba abren la ficha de su OC. */
    button.act-alert-oc, button.act-pend-oc { font-family: inherit; color: inherit; cursor: pointer; text-align: left; }
    button.act-alert-oc:hover, button.act-pend-oc:hover { border-color: var(--primary-light); }
    @media (max-width: 560px) {
      .act-head h1 { font-size: 1.2rem; }
      /* Los dos desplegables entran en un renglón: nombres cortos y sin el total. */
      .act-bar .hist-count { display: none; }
      .act-row { flex-wrap: wrap; }
      .act-body { flex-basis: 100%; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-brand u-pointer" onclick="window.location.href='menu.html'">
    <img src="assets/logo_claro.png" id="header-logo" alt="VIMECO" class="header-logo"
      onerror="this.style.display='none';document.getElementById('header-logo-fb').style.display='inline'">
    <span id="header-logo-fb" class="header-logo-fallback" style="display:none">VIMECO S.A.</span>
    <span class="header-title">Novedades</span>
  </div>
  <div class="header-user">
    <div class="user-badge">
      <span id="hdr-name">—</span>
    </div>
    <button class="btn btn-sm btn-outline btn-icon" id="btn-back" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
  </div>
</header>

<main class="app-main">
  <div class="hist-page">

    <div class="act-head">
      <h1>Novedades</h1>
      <button type="button" id="act-banner" class="act-unseen hidden" aria-pressed="false"></button>
      <button class="foc-btn foc-btn--clear act-ver-todas hidden" id="act-ver-todas"></button>
    </div>

    <div id="act-sinrespaldo" class="act-alert hidden"></div>

    <div id="act-pendientes" class="act-pend hidden"></div>

    <input type="search" id="act-search" class="hist-search act-search"
           placeholder="Buscar por artículo, proveedor, obra, responsable, N° OC…">

    <div class="act-dates">
      <div class="act-bar">
        <div class="act-dd">
          <button type="button" class="act-pick" id="act-tipo-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Tipo de novedad"></button>
          <div class="act-menu hidden" id="act-tipo-menu" role="listbox"></div>
        </div>
        <div class="act-dd">
          <button type="button" class="act-pick" id="act-periodo-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Período"></button>
          <div class="act-menu hidden" id="act-periodo-menu" role="listbox"></div>
        </div>
        <span class="hist-count" id="act-count"></span>
      </div>
      <div class="act-custom hidden" id="act-custom">
        <label for="act-desde">Desde</label>
        <input type="date" id="act-desde">
        <label for="act-hasta">Hasta</label>
        <input type="date" id="act-hasta">
      </div>
    </div>

    <div id="act-list" class="hist-list">
      <div class="hist-loading">Cargando novedades…</div>
    </div>
  </div>
</main>

<!-- ===== MODAL: Ficha de la OC (la misma que la vista previa y el Historial) ===== -->
<div class="modal-overlay hidden" id="modal-preview">
  <div class="modal foc-modal">
    <div class="foc-head">
      <div class="foc-head-l">
        <span class="foc-kicker">Orden de compra</span>
        <span class="foc-nro" id="preview-title">—</span>
        <div class="foc-chips" id="preview-chips"></div>
      </div>
      <div class="foc-head-r">
        <span class="foc-kicker">Total</span>
        <span class="foc-total" id="preview-total">—</span>
      </div>
      <button class="foc-x" id="modal-preview-close" aria-label="Cerrar"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="preview-body"></div>
    <div class="modal-footer foc-foot">
      <a class="foc-btn foc-btn--pdf" id="preview-pdf" target="_blank" rel="noopener" title="Abrir el PDF de la OC">
        <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Ver PDF</a>
      <div class="foc-foot-r">
        <span class="foc-nodrive hidden" id="preview-nodrive">Respaldo en Drive pendiente</span>
        <a class="foc-btn foc-btn--drive hidden" id="preview-drive" target="_blank" rel="noopener" title="Abrir la carpeta de la OC en Drive">
          <svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>Drive</a>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<!-- jspdf/logoBase64/ocGenerator/drive: para regenerar y resubir el PDF de una
     OC sin respaldo desde el panel de arriba, y para el PDF de la ficha. -->
<script src="js/jspdf.umd.min.js"></script>
<script src="js/logoBase64.js"></script>
<script src="js/ocGenerator.js"></script>
<script src="js/fichaOC.js"></script>
<script src="js/drive.js"></script>
<script src="js/driveQueue.js"></script>
<script src="js/driveBackup.js"></script>
<script src="js/entregas.js"></script>
<script src="js/fichaRemito.js"></script>
<script src="js/buscarOC.js"></script>
<script src="js/duplicados.js"></script>
<script src="js/actividad.js"></script>
</body>
</html>
