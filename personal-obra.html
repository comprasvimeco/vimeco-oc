<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO S.A. — Personal de obra</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VIMECO OC">
  <style>
    /* ===== Personal de la obra con la estética de pastillas (ámbar de Personal) ===== */
    .po-main { max-width: 1120px; }
    .po-ttl { display: flex; align-items: center; gap: .45rem; margin-bottom: .9rem; flex-wrap: wrap; }
    .po-t { font-size: 1.45rem; font-weight: 700; color: var(--primary-dark); margin: 0 .2rem 0 0; }
    .po-push { margin-left: auto; }
    .po-qnav { display: inline-flex; align-items: center; gap: .1rem; background: var(--white); border: 1px solid var(--gray-200); border-radius: 999px; padding: .1rem; }
    .po-qnav b { font-size: .8rem; color: var(--primary-dark); padding: 0 .3rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .po-ib { width: 30px; height: 30px; border-radius: 999px; border: none; background: transparent; color: var(--gray-500); display: inline-grid; place-items: center; cursor: pointer; flex: none; padding: 0; }
    .po-ib:hover:not(:disabled) { background: var(--gray-100); color: var(--primary-dark); }
    .po-ib:disabled { opacity: .3; cursor: default; }
    .po-ib .icon { width: 15px; height: 15px; }
    .po-ib--fill { background: var(--gray-100); }
    .po-ib--del:hover:not(:disabled) { background: #fde6e6; color: #b02a2a; }
    .po-pend { display: inline-flex; align-items: center; gap: .35rem; background: #fde6e6; color: #b02a2a; font-size: .76rem; font-weight: 700; padding: .2rem .65rem; border-radius: 999px; white-space: nowrap; }
    .po-pend::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #d64545; }
    .po-okp { display: inline-flex; align-items: center; gap: .3rem; background: #dff3e5; color: #1a7f3c; font-size: .76rem; font-weight: 700; padding: .2rem .65rem; border-radius: 999px; white-space: nowrap; }
    .po-closed { display: inline-flex; align-items: center; gap: .3rem; background: var(--gray-100); color: var(--gray-600); font-size: .76rem; font-weight: 700; padding: .2rem .65rem; border-radius: 999px; white-space: nowrap; }
    .po-okp .icon, .po-closed .icon { width: 12px; height: 12px; }
    .po-cfg { display: inline-flex; align-items: center; gap: .35rem; background: var(--white); border: 1px solid var(--gray-200); color: var(--gray-600); font: inherit; font-size: .78rem; font-weight: 600;
      padding: .26rem .7rem; border-radius: 999px; white-space: nowrap; cursor: pointer; }
    .po-cfg b { color: var(--primary-dark); font-variant-numeric: tabular-nums; }
    .po-cfg .icon { width: 13px; height: 13px; color: var(--gray-400); }
    .po-cfg:hover { border-color: #f0d4ae; }
    .po-card { background: var(--white); border-radius: 14px; box-shadow: 0 1px 2px rgba(26,58,92,.06), 0 6px 18px -10px rgba(26,58,92,.25); padding: .85rem .9rem; }
    .po-side-t { font-size: .72rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .55rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .po-sq { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; background: #fbeedd; color: #8a4f0d; }
    .po-sq .icon { width: 18px; height: 18px; }
    .foc-btn--amb { background: #b86a14; color: #fff; }
    .foc-btn--grn-solid { background: #1f8a45; color: #fff; }

    /* Dos columnas en escritorio; una en el teléfono con este orden: hoy, calendario, cierre, totales, cuadrilla */
    .po-lay { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1rem; align-items: start; }
    .po-col, .po-side { display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
    .po-side { position: sticky; top: 1rem; }

    /* Hoy */
    .po-hoy { display: flex; align-items: center; gap: .7rem; background: linear-gradient(135deg, #fdf3e6, #fff 75%); border-radius: 14px; padding: .75rem .85rem;
      box-shadow: 0 1px 2px rgba(26,58,92,.06), 0 6px 18px -10px rgba(26,58,92,.25); }
    .po-hoy > div { flex: 1; min-width: 0; }
    .po-hoy-k { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: #8a4f0d; }
    .po-hoy-t { font-weight: 700; color: var(--primary-dark); font-size: .95rem; }
    .po-hoy-s { font-size: .76rem; color: var(--gray-500); }
    .po-hoy.ok { background: linear-gradient(135deg, #e6f6ea, #fff 75%); }
    .po-hoy.ok .po-sq { background: #dff3e5; color: #1a7f3c; }
    .po-hoy.ok .po-hoy-k { color: #1a7f3c; }

    /* Calendario compacto */
    .po-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
    .po-dow { text-align: center; font-size: .66rem; font-weight: 700; color: var(--gray-400); }
    .po-cd { border-radius: 10px; background: var(--white); border: 1px solid var(--gray-200); min-height: 64px; padding: .35rem .45rem; display: flex; flex-direction: column;
      align-items: flex-start; gap: .2rem; cursor: pointer; position: relative; font: inherit; color: inherit; text-align: left; }
    .po-cd:hover { border-color: #f0d4ae; }
    .po-cd:focus-visible { outline: 2px solid var(--primary-light); outline-offset: 1px; }
    .po-cd.e { border: none; background: transparent; cursor: default; }
    .po-cd .n { font-weight: 700; font-size: .88rem; color: var(--gray-700); font-variant-numeric: tabular-nums; }
    .po-cd .m { font-size: .68rem; font-weight: 700; border-radius: 999px; padding: 0 .4rem; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .po-cd .mc { display: none; }
    .po-cd.ok { background: #f1faf4; border-color: #b9e2c6; }
    .po-cd.ok .m { background: #dff3e5; color: #1a7f3c; }
    .po-cd.pend .m { background: #fde6e6; color: #b02a2a; }
    .po-cd.carg .m { background: #fbeedd; color: #8a4f0d; }
    .po-cd.fut .n { color: var(--gray-400); }
    .po-cd.nolab { background: var(--gray-100); border-color: transparent; }
    .po-cd.nolab .n { color: var(--gray-400); }
    .po-cd.fer { background: #fbeedd; border-color: transparent; }
    .po-cd.fer .n, .po-cd.fer .m { color: #8a4f0d; }
    .po-cd.today { box-shadow: 0 0 0 2px #b86a14; }
    .po-cd .x { position: absolute; top: 5px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: #6b3fa0; }
    .po-legend { display: flex; flex-wrap: wrap; gap: .4rem .9rem; font-size: .7rem; color: var(--gray-500); margin-top: .65rem; }
    .po-legend span { display: inline-flex; align-items: center; gap: .3rem; }
    .po-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    /* Cierre y totales */
    .po-prog { height: 7px; border-radius: 999px; background: var(--gray-200); overflow: hidden; }
    .po-prog i { display: block; height: 100%; background: #1f8a45; border-radius: 999px; transition: width .3s; }
    .po-prog-t { font-size: .78rem; color: var(--gray-500); margin-top: .4rem; line-height: 1.4; }
    .po-prog-t b { color: var(--gray-700); }
    .po-acts { display: flex; gap: .45rem; margin-top: .75rem; flex-wrap: wrap; }
    .po-acts .foc-btn { flex: 1 1 auto; justify-content: center; }
    .po-t3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .45rem; }
    .po-t3 > div { border: 1px solid var(--gray-200); border-radius: 10px; padding: .4rem .55rem; min-width: 0; }
    .po-t3 span { display: block; font-size: .68rem; color: var(--gray-500); font-weight: 600; }
    .po-t3 b { display: block; font-size: .92rem; color: var(--primary-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

    /* Cuadrilla */
    .po-crew { display: flex; align-items: center; gap: .6rem; padding: .5rem .1rem; border-bottom: 1px solid var(--gray-200); }
    .po-crew:last-child { border-bottom: none; }
    .po-crew > .po-tx { min-width: 0; flex: 1; }
    .po-nm { font-weight: 700; color: var(--primary-dark); font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .po-sb { font-size: .72rem; color: var(--gray-500); display: flex; gap: .35rem; align-items: center; flex-wrap: wrap; margin-top: .1rem; }
    .po-sb a { color: inherit; }
    .po-av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .74rem; flex: none; }
    .po-av.a0 { background: #fbeedd; color: #8a4f0d; } .po-av.a1 { background: #e8eef7; color: #234870; } .po-av.a2 { background: #dcf3ef; color: #16695f; }
    .po-av.a3 { background: #f1e8fb; color: #6b3fa0; } .po-av.a4 { background: #fce8ee; color: #a23a57; }
    .po-mini { font-size: .68rem; font-weight: 700; border-radius: 999px; padding: .05rem .45rem; background: var(--gray-100); color: var(--gray-600); white-space: nowrap; text-decoration: none; }
    a.po-mini:hover { filter: brightness(.95); }
    .po-mini--dni { background: #e8eef7; color: #234870; }
    .po-mini--warn { background: #fde6e6; color: #b02a2a; }
    .po-mini--vio { background: #f1e8fb; color: #6b3fa0; }
    .po-mini--ok { background: #dff3e5; color: #1a7f3c; }
    .po-mini .icon { width: 11px; height: 11px; vertical-align: -1px; }
    .po-crew-x { display: flex; gap: .2rem; }
    .po-vacio { text-align: center; padding: 1rem; color: var(--gray-500); font-size: .86rem; }

    /* Parte del día: hoja */
    .po-ov { padding: 1.5rem; }
    .po-sheet { background: #f7f8fa; width: 100%; max-width: 900px; max-height: calc(100dvh - 3rem); border-radius: 18px; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: var(--shadow-lg); animation: popIn .28s var(--ease-spring) both; }
    .po-sheet:focus { outline: none; }
    .po-sh-hd { display: flex; align-items: center; gap: .5rem; padding: .7rem .8rem; background: var(--white); border-bottom: 1px solid var(--gray-200); flex: none; }
    .po-sh-tt { flex: 1; min-width: 0; }
    .po-sh-t { font-weight: 700; color: var(--primary-dark); font-size: 1.02rem; }
    .po-sh-s { font-size: .74rem; color: var(--gray-500); }
    .po-sh-s .po-mini { margin-left: .2rem; }
    .po-sh-body { flex: 1; min-height: 0; overflow-y: auto; padding: .9rem; display: flex; flex-direction: column; gap: .7rem; }
    .po-sh-ft { display: flex; align-items: center; gap: .6rem; padding: .7rem .9rem; background: var(--white); border-top: 1px solid var(--gray-200); flex: none; flex-wrap: wrap; }
    .po-sum { display: flex; gap: .3rem; flex-wrap: wrap; flex: 1; min-width: 0; }
    .po-ft-btns { display: flex; gap: .45rem; margin-left: auto; }
    .po-sec { background: var(--white); border-radius: 14px; padding: .75rem .8rem; box-shadow: 0 1px 2px rgba(26,58,92,.05); }
    .po-seg { display: flex; background: var(--gray-100); border-radius: 999px; padding: 3px; gap: 2px; }
    .po-seg button { flex: 1; border: none; background: transparent; font: inherit; font-size: .78rem; font-weight: 700; color: var(--gray-600); padding: .36rem .3rem; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .po-seg button[aria-pressed="true"] { background: var(--white); color: var(--primary-dark); box-shadow: 0 1px 3px rgba(26,58,92,.18); }
    .po-seg button:disabled { cursor: default; }
    .po-gen-row { display: flex; gap: .6rem; margin-top: .6rem; align-items: center; flex-wrap: wrap; }
    .po-gen-note { font-size: .72rem; color: var(--gray-500); margin-top: .5rem; }
    .po-step { display: inline-flex; align-items: center; background: var(--white); border: 1.5px solid var(--gray-200); border-radius: 10px; overflow: hidden; flex: none; }
    .po-step button { width: 30px; height: 32px; border: none; background: transparent; color: var(--gray-500); font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .po-step button:hover:not(:disabled) { background: var(--gray-100); }
    .po-step input { width: 48px; border: none; border-left: 1px solid var(--gray-200); border-right: 1px solid var(--gray-200); text-align: center; font: inherit; font-weight: 800;
      font-size: .95rem; color: var(--primary-dark); padding: .3rem 0; -moz-appearance: textfield; font-variant-numeric: tabular-nums; }
    .po-step input::-webkit-outer-spin-button, .po-step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .po-step input:disabled { background: var(--white); color: var(--gray-500); }
    .po-tog { display: inline-flex; align-items: center; gap: .45rem; font-size: .8rem; font-weight: 700; color: var(--gray-600); cursor: pointer; user-select: none; }
    .po-tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .po-tog i { width: 36px; height: 21px; border-radius: 999px; background: var(--gray-300); position: relative; transition: background .15s; flex: none; }
    .po-tog i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: left .15s; }
    .po-tog input:checked + i { background: #1f8a45; }
    .po-tog input:checked + i::after { left: 18px; }
    .po-tog input:focus-visible + i { outline: 2px solid var(--primary-light); outline-offset: 2px; }
    .po-tog input:disabled + i { opacity: .55; }

    .po-panel { background: var(--white); border-radius: 14px; box-shadow: 0 1px 2px rgba(26,58,92,.05); overflow: hidden; }
    .po-pp { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 34px; gap: .3rem .6rem; align-items: center; padding: .55rem .7rem; border-bottom: 1px solid var(--gray-200); }
    .po-pp:last-child { border-bottom: none; }
    .po-pp.aus { background: #fffafa; }
    .po-ctl { display: flex; align-items: center; gap: .6rem; }
    .po-est { display: flex; gap: .25rem; flex-wrap: wrap; }
    .po-est button { font: inherit; font-size: .72rem; font-weight: 700; border-radius: 999px; padding: .22rem .55rem; border: 1px solid var(--gray-200); color: var(--gray-500); background: var(--white); cursor: pointer; white-space: nowrap; }
    .po-est button:disabled { cursor: default; }
    .po-est button.on[data-e="presente"] { background: #dff3e5; color: #1a7f3c; border-color: #b9e2c6; }
    .po-est button.on[data-e="AU"] { background: #fde6e6; color: #b02a2a; border-color: #f4c4c4; }
    .po-est button.on[data-e="AC"] { background: #fbeedd; color: #8a4f0d; border-color: #f0d4ae; }
    .po-est button.on[data-e="CM"] { background: #f1e8fb; color: #6b3fa0; border-color: #dcc8f2; }
    .po-pp .po-step input { width: 40px; font-size: .88rem; }
    .po-pp .po-step button { width: 26px; height: 30px; }
    .po-food { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--gray-100); color: var(--gray-300); cursor: pointer; border: none; flex: none; }
    .po-food .icon { width: 16px; height: 16px; }
    .po-food.on { background: #dff3e5; color: #1a7f3c; }
    .po-food:disabled { cursor: default; }
    .po-st-tap { display: none; align-items: center; gap: .3rem; font: inherit; font-size: .74rem; font-weight: 700; border-radius: 999px; padding: .3rem .6rem; white-space: nowrap; border: none; cursor: pointer; }
    .po-st-tap .icon { width: 11px; height: 11px; transition: transform .15s; }
    .po-pp.open .po-st-tap .icon { transform: rotate(180deg); }
    .po-st-tap[data-k="presente"] { background: #dff3e5; color: #1a7f3c; }
    .po-st-tap[data-k="AU"] { background: #fde6e6; color: #b02a2a; }
    .po-st-tap[data-k="AC"] { background: #fbeedd; color: #8a4f0d; }
    .po-st-tap[data-k="CM"] { background: #f1e8fb; color: #6b3fa0; }
    .po-more-btn.on { background: #fbeedd; color: #8a4f0d; }
    .po-more { grid-column: 1 / -1; background: var(--gray-100); border-radius: 10px; padding: .55rem .6rem; display: none; flex-direction: column; gap: .5rem; margin-top: .2rem; }
    .po-pp.open .po-more { display: flex; }
    .po-more-r { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
    .po-more-k { font-size: .7rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; letter-spacing: .05em; min-width: 70px; }
    .po-more .foc-btn { padding: .28rem .65rem; font-size: .74rem; }
    .po-more .viat-list, .po-more .adj-list { margin: 0; }
    .po-more .viat-empty { display: none; }

    @media (max-width: 900px) {
      .po-lay { grid-template-columns: minmax(0, 1fr); gap: .75rem; }
      .po-col, .po-side { display: contents; }
      #po-hoy { order: 1; } #cal-card { order: 2; } #po-cierre { order: 3; } #po-totales { order: 4; } #crew-card { order: 5; }
    }
    @media (max-width: 760px) {
      .po-t { font-size: 1.2rem; }
      .po-push { display: none; }
      .po-cd { min-height: 50px; padding: .3rem .2rem; align-items: center; }
      .po-cd .m { font-size: .66rem; padding: 0 .35rem; }
      .po-cd .ml { display: none; } .po-cd .mc { display: inline; }
      .po-cd.pend { background: #fff5f5; border-color: #f4c4c4; }
      .po-cd.carg { background: #fffaf2; border-color: #f0d4ae; }
      .po-ov { padding: 0; align-items: flex-end; }
      .po-sheet { max-height: 96dvh; border-radius: 20px 20px 0 0; animation: poUp .25s ease-out both; }
      .po-sh-body { padding: .75rem; }
      .po-sh-ft { padding-bottom: calc(.7rem + env(safe-area-inset-bottom, 0px)); }
      .po-sum { flex-basis: 100%; }
      .po-ft-btns { width: 100%; }
      .po-ft-btns .foc-btn { flex: 1; justify-content: center; padding: .65rem; }
      .po-seg button { font-size: .74rem; }
      /* El parte en el teléfono: el estado se toca y despliega todo lo de la persona */
      .po-pp { grid-template-columns: 34px minmax(0, 1fr) auto; }
      .po-st-tap { display: inline-flex; }
      .po-more-btn { display: none; }
      .po-ctl { display: none; grid-column: 1 / -1; flex-wrap: wrap; background: var(--gray-100); border-radius: 10px 10px 0 0; padding: .55rem .6rem 0; margin-top: .2rem; }
      .po-pp.open .po-ctl { display: flex; }
      .po-pp.open .po-more { margin-top: -.3rem; border-radius: 0 0 10px 10px; }
    }
    @keyframes poUp { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .po-sheet { animation: none; } .po-prog i, .po-tog i, .po-tog i::after { transition: none; } }

    /* Modales que siguen igual: padrón, ficha, viático, adjuntos y vista previa del Excel */
    .crew-item { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; padding:.6rem .25rem; border-bottom:1px solid var(--gray-100); }
    .crew-item:last-child { border-bottom:none; }
    .crew-info { flex:1 1 55%; min-width:0; }
    .crew-item > .btn { margin-left:auto; flex-shrink:0; }
    .crew-name { font-weight:600; color:var(--gray-800); }
    .crew-meta { font-size:.82rem; color:var(--gray-500); }
    /* Modal del padrón: buscador + alta nueva + filtro de inactivos */
    .pad-tools { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.5rem; }
    .pad-tools input { flex:1; min-width:160px; }
    .padron-inactivos { display:flex; align-items:center; gap:.4rem; font-size:.8rem; color:var(--gray-500); margin-bottom:.5rem; cursor:pointer; }
    .padron-inactivos input { margin:0; }
    #padron-list { max-height:52vh; overflow-y:auto; }
    .crew-obras { margin-top:.25rem; }
    .crew-item.inactivo .crew-info { opacity:.6; }
    .crew-inact { font-size:.72rem; color:#b91c1c; font-weight:600; }
    .dni-preview { margin-top:.5rem; }
    .dni-preview img { max-width:100%; max-height:160px; border-radius:8px; border:1px solid var(--gray-200); }
    .adj-list { display:flex; flex-wrap:wrap; gap:.4rem; margin:.35rem 0; }
    .adj-chip { display:inline-flex; align-items:center; gap:.35rem; background:var(--gray-100); border:1px solid var(--gray-200); border-radius:999px; padding:.2rem .6rem; font-size:.78rem; max-width:100%; }
    .adj-chip a { color:#1a3a5c; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px; }
    .adj-chip button { border:none; background:none; color:var(--gray-500); cursor:pointer; font-size:.95rem; line-height:1; padding:0; }
    .adj-chip button:hover { color:#d64545; }
    /* Viáticos del parte */
    .viat-list { display:flex; flex-wrap:wrap; gap:.4rem; margin:.35rem 0; }
    .viat-empty { font-size:.8rem; color:var(--gray-400); }
    .viat-chip { display:inline-flex; align-items:center; gap:.4rem; background:#eef4fb; border:1px solid #cfe0f2; border-radius:8px; padding:.25rem .6rem; font-size:.8rem; max-width:100%; }
    .viat-chip .viat-monto { font-weight:700; color:#1a3a5c; }
    .viat-chip .viat-motivo { color:var(--gray-600); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px; }
    .viat-chip a { text-decoration:none; }
    .viat-chip button { border:none; background:none; color:var(--gray-500); cursor:pointer; font-size:.95rem; line-height:1; padding:0; }
    .viat-chip button:hover { color:#d64545; }
    .dni-folder { text-decoration:none; font-size:.9rem; margin-left:.25rem; }
    .v-file-name { font-size:.8rem; color:var(--gray-500); margin-top:.25rem; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    /* Vista previa del Excel (tabla read-only, estilos inline por celda) */
    #excel-preview { height:100%; overflow:auto; padding:.5rem; -webkit-overflow-scrolling:touch; }
    #excel-preview table { border-collapse:collapse; width:max-content; }
    #excel-preview td { padding:2px 6px; white-space:nowrap; }
    #excel-preview a { color:inherit; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-brand u-pointer" onclick="window.location.href='menu.html'">
    <img src="assets/logo_claro.png" id="header-logo" alt="VIMECO" class="header-logo"
      onerror="this.style.display='none';document.getElementById('header-logo-fb').style.display='inline'">
    <span id="header-logo-fb" class="header-logo-fallback" style="display:none">VIMECO S.A.</span>
    <span class="header-title" id="hdr-obra">Obra</span>
  </div>
  <div class="header-user">
    <div class="user-badge"><span id="hdr-name">—</span></div>
    <button class="btn btn-sm btn-outline btn-icon" id="btn-back" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
  </div>
</header>

<main class="app-main po-main">

  <!-- Título: obra, quincena, estado y constantes de la obra -->
  <div class="po-ttl">
    <h1 class="po-t" id="po-obra">Obra</h1>
    <span class="po-qnav">
      <button type="button" class="po-ib" id="cal-prev" aria-label="Quincena anterior" title="Quincena anterior"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <b id="q-label">—</b>
      <button type="button" class="po-ib" id="cal-next" aria-label="Quincena siguiente" title="Quincena siguiente"><svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
    </span>
    <span id="po-estado"></span>
    <span class="po-push"></span>
    <button type="button" class="po-cfg" id="btn-cfg-jornada" title="Editar la jornada de la obra"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Jornada <b id="cfg-jornada">—</b></button>
    <button type="button" class="po-cfg" id="btn-cfg-comida" title="Editar el valor de la comida"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg> Comida <b id="cfg-comida">—</b></button>
  </div>

  <div class="po-lay">
    <div class="po-col">
      <div id="po-hoy" class="hidden"></div>
      <div class="po-card" id="cal-card">
        <div id="cal-container" class="po-vacio">Cargando calendario…</div>
      </div>
      <div class="po-card" id="crew-card">
        <div class="po-side-t"><span>Cuadrilla <span id="crew-count"></span></span>
          <button type="button" class="foc-btn foc-btn--warn" id="btn-add-personal" style="padding:.3rem .75rem;font-size:.78rem;text-transform:none;letter-spacing:0"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Agregar</button>
        </div>
        <div id="crew-list"><div class="po-vacio">Cargando cuadrilla…</div></div>
      </div>
    </div>
    <div class="po-side">
      <div class="po-card" id="po-cierre"></div>
      <div class="po-card" id="po-totales"></div>
    </div>
  </div>

</main>

<!-- Modal: Agregar / Editar personal -->
<div class="modal-overlay hidden" id="modal-personal">
  <div class="modal modal--sm">
    <div class="modal-header">
      <span class="modal-title" id="modal-personal-title">Agregar personal</span>
      <button class="modal-close" id="modal-personal-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:.75rem;">
        <div class="form-group u-flex-1">
          <label for="p-nombre">Nombre *</label>
          <input type="text" id="p-nombre" class="form-control" placeholder="Juan">
        </div>
        <div class="form-group u-flex-1">
          <label for="p-apellido">Apellido *</label>
          <input type="text" id="p-apellido" class="form-control" placeholder="Pérez">
        </div>
      </div>
      <div style="display:flex;gap:.75rem;">
        <div class="form-group u-flex-1">
          <label for="p-dni">DNI</label>
          <input type="text" id="p-dni" class="form-control" inputmode="numeric" placeholder="30123456">
        </div>
        <div class="form-group u-flex-1">
          <label for="p-categoria">Categoría</label>
          <select id="p-categoria" class="form-control"></select>
        </div>
      </div>
      <div style="display:flex;gap:.75rem;">
        <div class="form-group u-flex-1">
          <label for="p-telefono">Teléfono</label>
          <input type="tel" id="p-telefono" class="form-control" inputmode="tel" placeholder="11 2345-6789">
        </div>
        <div class="form-group u-flex-1">
          <label for="p-domicilio">Domicilio</label>
          <input type="text" id="p-domicilio" class="form-control" placeholder="Calle 123, Localidad">
        </div>
      </div>
      <div style="display:flex;gap:.75rem;align-items:flex-end;">
        <div class="form-group u-flex-1 u-mb-0">
          <label style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
            <input type="checkbox" id="p-horas-extra" style="width:18px;height:18px;"> Horas extras
          </label>
        </div>
        <div class="form-group u-flex-1 u-mb-0">
          <label for="p-pct-extra">% extra</label>
          <input type="number" id="p-pct-extra" class="form-control" min="0" step="1" placeholder="0">
        </div>
      </div>
      <label style="font-size:.9rem;color:var(--gray-700);font-weight:500;">Foto del DNI</label>
      <div style="display:flex;gap:.75rem;margin-top:.35rem;">
        <div class="form-group u-flex-1 u-mb-0">
          <label for="p-foto-frente" style="font-size:.78rem;color:var(--gray-500);">Frente</label>
          <input type="file" id="p-foto-frente" class="form-control" accept="image/*">
          <div class="dni-preview" id="p-foto-frente-preview"></div>
        </div>
        <div class="form-group u-flex-1 u-mb-0">
          <label for="p-foto-dorso" style="font-size:.78rem;color:var(--gray-500);">Dorso</label>
          <input type="file" id="p-foto-dorso" class="form-control" accept="image/*">
          <div class="dni-preview" id="p-foto-dorso-preview"></div>
        </div>
      </div>
      <div id="modal-personal-error" class="alert alert-error hidden"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-personal-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-personal-save">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: Agregar personal (padrón + alta nueva) -->
<div class="modal-overlay hidden" id="modal-padron">
  <div class="modal modal--sm">
    <div class="modal-header">
      <span class="modal-title">Agregar personal</span>
      <button class="modal-close" id="modal-padron-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="pad-tools">
        <input type="text" id="padron-search" class="form-control" placeholder="Nombre o DNI…" autocomplete="off">
        <button class="btn btn-outline btn-sm" id="btn-incorporar">+ Incorporar nuevo</button>
      </div>
      <label class="padron-inactivos">
        <input type="checkbox" id="padron-ver-inactivos"> Ver inactivos
      </label>
      <div id="padron-list"><div class="hist-loading">Cargando padrón…</div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-padron-cancel">Cerrar</button>
    </div>
  </div>
</div>

<!-- Modal: Configuración de la obra -->
<div class="modal-overlay hidden" id="modal-config-obra">
  <div class="modal modal--sm">
    <div class="modal-header">
      <span class="modal-title">Configuración de la obra</span>
      <button class="modal-close" id="modal-config-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <p style="color:var(--gray-500);font-size:.85rem;margin-top:0;">Estos valores precargan el parte diario de esta obra.</p>
      <div style="display:flex;gap:.75rem;">
        <div class="form-group u-flex-1">
          <label for="cfg-jornada-input">Jornada (horas)</label>
          <input type="number" id="cfg-jornada-input" class="form-control" min="0" max="24" step="0.5" placeholder="8">
        </div>
        <div class="form-group u-flex-1">
          <label for="cfg-comida-input">Valor comida ($)</label>
          <input type="number" id="cfg-comida-input" class="form-control" min="0" step="0.01" placeholder="0">
        </div>
      </div>
      <div id="modal-config-error" class="alert alert-error hidden"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-config-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-config-save">Guardar</button>
    </div>
  </div>
</div>

<!-- Hoja: Parte del día -->
<div class="modal-overlay po-ov hidden" id="modal-parte">
  <div class="po-sheet" role="dialog" aria-modal="true" aria-labelledby="parte-title" tabindex="-1">
    <div class="po-sh-hd">
      <button type="button" class="po-ib po-ib--fill" id="parte-prev" aria-label="Día anterior" title="Día anterior"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="po-sh-tt"><div class="po-sh-t" id="parte-title">Parte del día</div><div class="po-sh-s" id="parte-info"></div></div>
      <button type="button" class="po-ib po-ib--fill" id="parte-next" aria-label="Día siguiente" title="Día siguiente"><svg class="icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
      <button type="button" class="po-ib po-ib--fill" id="modal-parte-close" aria-label="Cerrar" title="Cerrar"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="po-sh-body">
      <div id="parte-general" class="po-sec"></div>
      <div id="parte-list" class="po-panel"></div>
    </div>
    <div class="po-sh-ft">
      <span class="po-sum" id="parte-sum"></span>
      <div class="po-ft-btns" id="parte-footer">
        <button type="button" class="foc-btn foc-btn--clear" id="parte-guardar">Guardar</button>
        <button type="button" class="foc-btn foc-btn--grn-solid" id="parte-validar">Validar día</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Agregar viático -->
<div class="modal-overlay hidden" id="modal-viatico">
  <div class="modal modal--sm">
    <div class="modal-header">
      <span class="modal-title" id="modal-viatico-title">Viático</span>
      <button class="modal-close" id="modal-viatico-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="v-monto">Monto ($) *</label>
        <input type="number" id="v-monto" class="form-control" min="0" step="0.01" inputmode="decimal" placeholder="0">
      </div>
      <div class="form-group">
        <label for="v-motivo">Motivo *</label>
        <input type="text" id="v-motivo" class="form-control" placeholder="Ej: pasaje, combustible…">
      </div>
      <div class="form-group u-mb-0">
        <label for="v-file">Adjunto (opcional)</label>
        <input type="file" id="v-file" class="form-control" accept="image/*,application/pdf">
        <span class="v-file-name" id="v-file-name"></span>
      </div>
      <div id="modal-viatico-error" class="alert alert-error hidden"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-viatico-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-viatico-save">Agregar</button>
    </div>
  </div>
</div>

<!-- Modal: Vista previa del Excel (read-only) -->
<div class="modal-overlay hidden" id="modal-excel-preview">
  <div class="modal modal--xl">
    <div class="modal-header">
      <span class="modal-title" id="excel-preview-title">Vista previa de la planilla</span>
      <button class="modal-close" id="modal-excel-preview-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div id="excel-preview"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-excel-preview-close2">Cerrar</button>
      <button class="btn btn-outline" id="btn-excel-print"><svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Imprimir / PDF</button>
      <button class="btn btn-primary" id="btn-excel-download"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg> Descargar Excel</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/drive.js"></script>
<script src="js/personal-obra.js"></script>
<script>
  // Auto-actualización del service worker (evita quedar pegado a una versión vieja en la PWA).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/vimeco-oc/sw.js', { updateViaCache: 'none' })
      .then(reg => reg.update()).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      // No recargar si hay un parte abierto sin guardar.
      const parte = document.getElementById('modal-parte');
      if (parte && !parte.classList.contains('hidden')) return;
      window.location.reload();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible')
        navigator.serviceWorker.ready.then(reg => reg.update()).catch(() => {});
    });
  }
</script>
</body>
</html>
