<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO S.A. — Gestión de Usuarios</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    .perm-row { display:flex; align-items:flex-start; gap:.7rem; padding:.7rem .25rem; border-bottom:1px solid var(--gray-100); cursor:pointer; }
    .perm-row:last-of-type { border-bottom:none; }
    .perm-row input { width:20px; height:20px; margin-top:.15rem; flex-shrink:0; }
    .perm-row span { display:flex; flex-direction:column; gap:.15rem; }
    .perm-row strong { color:var(--gray-800); font-size:.95rem; font-weight:600; }
    .perm-row small { color:var(--gray-500); font-size:.8rem; line-height:1.3; }
    .perm-monto { display:flex; flex-direction:column; gap:.35rem; padding:.8rem .25rem .4rem; border-top:1px solid var(--gray-100); }
    .perm-monto strong { color:var(--gray-800); font-size:.95rem; font-weight:600; }
    .perm-monto small { color:var(--gray-500); font-size:.8rem; line-height:1.3; }
    .perm-monto-input { display:flex; align-items:center; gap:.4rem; }
    .perm-monto-input span { color:var(--gray-600); font-weight:600; }

    /* ---- Lista de usuarios ---- */
    .usr-page { max-width: 1040px; margin: 0 auto; padding: 1rem; }
    .usr-toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: .75rem;
      flex-wrap: wrap; margin: .5rem 0 1.1rem; }
    .usr-title { font-size: 1.25rem; font-weight: 800; color: var(--primary); line-height: 1.2; }
    .usr-count { font-size: .8rem; color: var(--gray-500); margin-top: .15rem; }
    .usr-add { background: var(--grad-header); color: #fff; box-shadow: 0 6px 18px -8px rgba(26,58,92,.55); }
    .usr-add .icon { width: 16px; height: 16px; }

    .usr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: .8rem; }
    .usr-grid > .hist-loading, .usr-grid > .hist-empty { grid-column: 1 / -1; }
    .usr-card { display: flex; flex-direction: column; background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border); border-radius: 14px; box-shadow: var(--shadow-glass);
      padding: .9rem 1rem .75rem; transition: transform .18s var(--ease-spring), box-shadow .18s; }
    .usr-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-glow); }
    .usr-card--off { opacity: .6; }
    .usr-card--off:hover { opacity: .85; }

    .usr-head { display: flex; align-items: center; gap: .75rem; }
    .usr-avatar { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center;
      justify-content: center; background: var(--grad-header); color: #fff; font-weight: 800; font-size: .95rem;
      letter-spacing: .03em; }
    .usr-card--off .usr-avatar { background: var(--gray-400); }
    .usr-id { min-width: 0; flex: 1; }
    .usr-name { font-size: 1rem; font-weight: 700; color: var(--gray-900); line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .usr-meta { display: flex; align-items: center; gap: .45rem; flex-wrap: wrap; margin-top: .2rem;
      font-size: .76rem; color: var(--gray-500); }
    .usr-code { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700;
      color: var(--gray-600); background: var(--gray-100); border-radius: 5px; padding: 0 .35rem; }
    .usr-meta-i { display: inline-flex; align-items: center; gap: .25rem; }
    .usr-meta-i .icon { width: 12px; height: 12px; }
    .usr-warn { color: #854d0e; background: #fef9c3; border-radius: 999px; padding: 0 .45rem; font-weight: 700; }
    .usr-off { flex-shrink: 0; font-size: .7rem; font-weight: 700; padding: .12rem .55rem; border-radius: 999px;
      background: #fde6e6; color: #b02a2a; }

    .usr-perms { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .7rem; }
    .usr-perm { display: inline-flex; align-items: center; gap: .3rem; padding: .16rem .6rem .16rem .5rem;
      border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .usr-perm .icon { width: 12px; height: 12px; }
    .usr-perm--caja     { background: #dcf3ef; color: #16695f; }
    .usr-perm--admin    { background: #efebfd; color: #5a45a8; }
    .usr-perm--obra     { background: #fdf0dc; color: #8a5a0b; }
    .usr-perm--taller   { background: #e8eefc; color: #2c4fa8; }
    .usr-perm--reportes { background: #fce8ee; color: #a23a57; }
    .usr-perm--nov      { background: #e0f2fe; color: #0369a1; }
    .usr-perm--autoriza { background: #fbf3dc; color: #7a5c0f; box-shadow: inset 0 0 0 1px #ecd9a0; }
    .usr-perm--autoriza b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
    .usr-noperms { font-size: .76rem; color: var(--gray-400); font-style: italic; }

    /* Acciones: pastillas en un renglón al pie, como en Novedades. Desactivar va aparte, a la derecha. */
    .usr-actions { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem;
      margin-top: auto; padding-top: .6rem; border-top: 1px solid var(--gray-100); }
    .usr-perms + .usr-actions { margin-top: .75rem; }
    .usr-actions .foc-btn { font-size: .76rem; padding: .35rem .8rem; white-space: nowrap; }
    .usr-actions .foc-btn .icon { width: 13px; height: 13px; }
    .usr-actions .usr-toggle { margin-left: auto; }

    @media (max-width: 520px) {
      .usr-grid { grid-template-columns: 1fr; }
      .usr-toolbar { align-items: center; }
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-brand u-pointer" onclick="window.location.href='menu.html'">
    <img src="assets/logo_claro.png" id="header-logo" alt="VIMECO" class="header-logo"
      onerror="this.style.display='none';document.getElementById('header-logo-fb').style.display='inline'">
    <span id="header-logo-fb" class="header-logo-fallback" style="display:none">VIMECO S.A.</span>
    <span class="header-title">Gestión de Usuarios</span>
  </div>
  <div class="header-user">
    <div class="user-badge"><span id="hdr-name">—</span></div>
    <button class="btn btn-sm btn-outline btn-icon" id="btn-back" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
  </div>
</header>

<main class="app-main">
  <div class="usr-page">
    <div class="usr-toolbar">
      <div>
        <div class="usr-title">Usuarios del sistema</div>
        <div class="usr-count" id="users-count"></div>
      </div>
      <button class="foc-btn usr-add" id="btn-add-user"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Agregar usuario</button>
    </div>
    <div id="users-list" class="usr-grid">
      <div class="hist-loading">Cargando usuarios…</div>
    </div>
  </div>
</main>

<!-- Modal: Agregar / Editar usuario -->
<div class="modal-overlay hidden" id="modal-user">
  <div class="modal modal--sm">
    <div class="modal-header">
      <span class="modal-title" id="modal-user-title">Agregar usuario</span>
      <button class="modal-close" id="modal-user-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="user-codigo">Código (4 dígitos)</label>
        <input type="text" id="user-codigo" class="form-control" placeholder="0001" maxlength="4">
      </div>
      <div class="form-group u-mb-0">
        <label for="user-nombre">Nombre completo</label>
        <input type="text" id="user-nombre" class="form-control" placeholder="Nombre y apellido / título">
      </div>
      <div id="modal-user-error" class="alert alert-error hidden"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-user-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-user-save">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: Permisos -->
<div class="modal-overlay hidden" id="modal-permisos">
  <div class="modal modal--sm">
    <div class="modal-header">
      <span class="modal-title">Permisos de <span id="modal-permisos-name">—</span></span>
      <button class="modal-close" id="modal-permisos-close"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <label class="perm-row">
        <input type="checkbox" id="perm-caja">
        <span><strong>Caja Chica</strong><small>Registra ingresos y egresos de su propia caja.</small></span>
      </label>
      <label class="perm-row">
        <input type="checkbox" id="perm-admin">
        <span><strong>Administrador</strong><small>Funciones de admin (incluida la Caja de todos), salvo el menú de Administración.</small></span>
      </label>
      <label class="perm-row">
        <input type="checkbox" id="perm-jefeObra">
        <span><strong>Jefe de Obra</strong><small>Gestiona la cuadrilla y los partes de las obras asignadas (módulo Personal).</small></span>
      </label>
      <label class="perm-row">
        <input type="checkbox" id="perm-jefeTaller">
        <span><strong>Jefe de Taller</strong><small>Accede a Equipos: edita datos, foto y repuestos de cada equipo.</small></span>
      </label>
      <label class="perm-row">
        <input type="checkbox" id="perm-reportes">
        <span><strong>Reportes</strong><small>Accede al panel de Reportes (gasto por obra, equipo, proveedor).</small></span>
      </label>
      <label class="perm-row">
        <input type="checkbox" id="perm-novedades">
        <span><strong>Novedades</strong><small>Ve el feed de Novedades (OC, remitos y facturas que se cargan).</small></span>
      </label>
      <div class="perm-monto">
        <label for="perm-autorizaDesde"><strong>Autoriza OC desde</strong></label>
        <div class="perm-monto-input"><span>$</span><input type="text" id="perm-autorizaDesde" class="form-control" inputmode="numeric" placeholder="Sin monto"></div>
        <small>Las OC que superen este monto se le tienen que pedir a este usuario o a quien tenga un monto mayor. Si varios comparten el mismo monto, sirve cualquiera de ellos. Vacío: no participa.</small>
      </div>
      <div id="modal-permisos-error" class="alert alert-error hidden"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-permisos-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-permisos-save">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: Confirmar acción -->
<div class="modal-overlay hidden" id="modal-confirm">
  <div class="modal modal--sm">
    <div class="modal-header">
      <span class="modal-title" id="modal-confirm-title">Confirmar</span>
    </div>
    <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
      <p id="modal-confirm-msg" style="color:var(--gray-600);"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
      <button class="btn btn-primary" id="modal-confirm-yes">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/usuarios.js"></script>
</body>
</html>
