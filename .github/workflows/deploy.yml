name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy1.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: node build.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.html caja.html menu.html index.html sw.js
          git diff --cached --quiet || git commit -m "ci: bump version [skip ci]"
          # En un «Re-run» el bump ya está en main y el push rebota: que no frene la publicación.
          git push || echo "::warning::No se pudo pushear el bump (¿re-run?); se publica igual."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # deploy-pages a veces no encuentra el artefacto recién subido (lado de GitHub): un segundo intento tras esperar.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de reintentar
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
