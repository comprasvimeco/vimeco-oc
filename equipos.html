<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO S.A. — Gestión de Equipos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    /* Teléfono: mosaico. Escritorio (≥1000px): lista por familia + ficha al costado. */
    .eq-corto { display: none; }
    @media (max-width: 560px) {
      .eq-corto { display: inline; } .eq-largo { display: none; }
      .eq-ttl #cnt-inact { display: none; }
    }
    .eq-side-acts { display: flex; gap: .5rem; margin-top: .75rem; }
    .eq-side-acts .foc-btn { flex: 1; justify-content: center; padding: .6rem; font-size: .86rem; }
    .eq-side-vacio { text-align: center; color: var(--gray-500); padding: 2.5rem 1rem; }
    .eq-side-vacio .eq-sq { margin: 0 auto .6rem; width: 48px; height: 48px; border-radius: 14px; }

  </style>
</head>
<body>

<header class="app-header">
  <div class="header-brand u-pointer" onclick="window.location.href='menu.html'">
    <img src="assets/logo_claro.png" id="header-logo" alt="VIMECO" class="header-logo"
      onerror="this.style.display='none';document.getElementById('header-logo-fb').style.display='inline'">
    <span id="header-logo-fb" class="header-logo-fallback" style="display:none">VIMECO S.A.</span>
    <span class="header-title">Gestión de Equipos</span>
  </div>
  <div class="header-user">
    <div class="user-badge"><span id="hdr-name">—</span></div>
    <button class="btn btn-sm btn-outline btn-icon" id="btn-back" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
  </div>
</header>

<main class="app-main eq-main">
  <div class="eq-ttl">
    <h1 class="eq-t">Equipos</h1>
    <span class="eq-cnt hidden" id="cnt-total"></span>
    <span class="eq-cnt hidden" id="cnt-obra"></span>
    <span class="eq-cnt hidden" id="cnt-inact"></span>
    <div class="eq-push">
      <button type="button" class="foc-btn foc-btn--clear hidden" id="btn-seed">Importar lista inicial</button>
      <button type="button" class="foc-btn foc-btn--tea" id="btn-add-equipo"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="eq-largo">Agregar equipo</span><span class="eq-corto">Agregar</span></button>
    </div>
  </div>

  <div class="eq-srch">
    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="buscar-equipo" placeholder="Código, tipo, patente o responsable…" autocomplete="off" aria-label="Buscar equipo">
  </div>

  <div class="eq-flt">
    <div class="act-dd">
      <button type="button" class="act-pick eq-pick-tea" data-dd="ubic" aria-haspopup="listbox" aria-expanded="false" aria-label="Ubicación"></button>
      <div class="act-menu act-menu--scroll hidden" id="menu-ubic" role="listbox"></div>
    </div>
    <div class="act-dd">
      <button type="button" class="act-pick" data-dd="fam" aria-haspopup="listbox" aria-expanded="false" aria-label="Familia"></button>
      <div class="act-menu act-menu--scroll hidden" id="menu-fam" role="listbox"></div>
    </div>
    <div class="eq-seg" id="seg-estado" role="group" aria-label="Estado">
      <button type="button" data-e="act">Activos</button>
      <button type="button" data-e="inact">Inactivos</button>
      <button type="button" data-e="todos">Todos</button>
    </div>
  </div>

  <div id="equipos-list">
    <div class="hist-loading">Cargando equipos…</div>
  </div>
</main>

<!-- Alta rápida: la foto, los repuestos y los documentos se cargan después en la ficha -->
<div class="modal-overlay eq-dlg-ov hidden" id="modal-equipo">
  <div class="eq-dlg" role="dialog" aria-modal="true" aria-labelledby="modal-equipo-title">
    <div class="eq-dlg-h">
      <span class="eq-sq"><svg class="icon" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></span>
      <div>
        <h2 id="modal-equipo-title">Agregar equipo</h2>
        <p>La foto, los repuestos y los documentos se cargan después en la ficha.</p>
      </div>
      <button type="button" class="modal-close" id="modal-equipo-close" aria-label="Cerrar"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="eq-dlg-row">
      <div class="form-group">
        <label for="equipo-codigo">Código *</label>
        <input type="text" id="equipo-codigo" class="form-control" placeholder="Ej: C 172">
      </div>
      <div class="form-group">
        <label for="equipo-patente">Patente</label>
        <input type="text" id="equipo-patente" class="form-control" placeholder="Ej: AF440LL" autocapitalize="characters" style="text-transform:uppercase">
      </div>
    </div>
    <div class="form-group">
      <label for="equipo-tipo">Tipo / descripción</label>
      <input type="text" id="equipo-tipo" class="form-control" placeholder="Ej: Camion L111">
    </div>
    <div class="form-group">
      <label>Familia</label>
      <div class="eq-fam-chips" id="equipo-familia" role="group" aria-label="Familia"></div>
      <div class="eq-hint" id="equipo-familia-hint"></div>
    </div>
    <div class="form-group u-mb-0">
      <label for="equipo-responsable">Responsable</label>
      <input type="text" id="equipo-responsable" class="form-control" placeholder="Nombre y apellido">
    </div>
    <div id="modal-equipo-error" class="alert alert-error hidden" style="margin-top:.7rem"></div>
    <div class="eq-dlg-f">
      <button type="button" class="foc-btn foc-btn--clear" id="modal-equipo-cancel">Cancelar</button>
      <button type="button" class="foc-btn foc-btn--tea" id="modal-equipo-save"><svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>Crear y abrir la ficha</span></button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/buscarOC.js"></script>
<script src="js/driveBackup.js"></script>
<script src="js/duplicados.js"></script>
<script src="js/equiposComun.js"></script>
<script src="js/equipos.js"></script>
</body>
</html>
