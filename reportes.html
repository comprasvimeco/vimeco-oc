<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO S.A. — Reportes</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    /* ===== Reportes (rediseño traído de Leva) =====
       Tarjetas planas, un solo color para las series únicas y el estado en una pastilla.
       Todo color sale de un token, con los tonos de VIMECO. Cada obra tiene su color en
       todas las pestañas (--s1…--s8, validados para daltonismo). */
    body.rx-page {
      --ink: #1a3a5c; --ink-2: #64708a; --surface: #ffffff; --sunk: #f1f4f9; --line: #e2e7ef;
      --lila: #2557a7; --lila-deep: #234870; --lila-soft: #e3ecf8;
      --menta-bg: #ddf5e8; --menta-fg: #1d6b45; --durazno-bg: #ffe7d6; --durazno-fg: #9a4a16; --rosa-bg: #fbe1e6; --rosa-fg: #a0283e;
      --shadow-leva: 0 1px 2px rgba(26,58,92,.06), 0 8px 22px -12px rgba(26,58,92,.28);
      --font-display: 'Segoe UI', system-ui, -apple-system, sans-serif; --font-texto: var(--font-display);
      --s1: #4A45A0; --s2: #0C8CA8; --s3: #C2862D; --s4: #A0527E;
      --s5: #2F8F5B; --s6: #3E7BD6; --s7: #D2603F; --s8: #7A3FA8; --otros: #A9A4C4;
      --rx-bar: #2557a7;     /* una sola serie: barras y lo gastado */
      --rx-warn: #C2862D;    /* gasto adelantado, rubro cerca del tope */
      --gris-bg: #eceff4; --gris-fg: #5b6478;
      --t-bg: var(--lila-soft); --t-fg: var(--lila-deep);
    }
    /* Los botones de la ventana y la ficha, con los tonos de la ficha de OC */
    .foc-btn--sec  { background: var(--gray-100); color: var(--gray-700); }
    .foc-btn--main { background: var(--primary); color: #fff; }
    .foc-btn--oc   { background: #e8eef7; color: var(--primary); }
    .foc-btn--fac  { background: #f1e8fb; color: #6b3fa0; }

    .rx-main { max-width: none; padding: 0; }
    #rx-tabla { overflow-x: auto; }
    .rx { max-width: 1240px; margin: 0 auto; padding: 1.25rem 1rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
    .rx h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; color: var(--ink); margin: 0; }
    .rx h3 { font-family: var(--font-display); font-size: .95rem; font-weight: 700; color: var(--ink); margin: 0; }
    .rx-muted { color: var(--ink-2); font-size: .84rem; }
    .rx-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rx-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .rx-row > * { min-width: 0; }

    /* ---- Cabecera: período, mes, filtros y el total ---- */
    .rx-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.25rem; }
    .rx-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
    .rx-seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 3px; }
    .rx-seg button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: .86rem; font-weight: 600;
      padding: .4rem .85rem; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .rx-seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(26,58,92,.14); }
    .rx-mes { display: flex; align-items: center; gap: .5rem; }
    .rx-mes button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 32px; height: 32px;
      border-radius: 9px; font-size: 1.15rem; line-height: 1; cursor: pointer; }
    .rx-mes button:disabled { opacity: .35; cursor: default; }
    .rx-mes b { font-family: var(--font-display); min-width: 8.5em; text-align: center; color: var(--ink); }
    .rx-chip { display: inline-flex; align-items: center; gap: .35rem; border: 0; border-radius: 999px; padding: .32rem .75rem;
      background: var(--lila-soft); color: var(--lila-deep); font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; max-width: 100%; }
    .rx-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rx-tot { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
    .rx-tot .v { font-family: var(--font-display); font-weight: 700; font-size: 1.4rem; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
    /* Estado: una pastilla. */
    .rx-pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: .74rem; font-weight: 600; white-space: nowrap; color: var(--ink-2); background: var(--sunk); }
    .rx-pill.rx-ok   { color: var(--menta-fg); background: var(--menta-bg); }
    .rx-pill.rx-warn { color: var(--durazno-fg); background: var(--durazno-bg); }
    .rx-pill.rx-bad  { color: var(--rosa-fg); background: var(--rosa-bg); }
    .rx-pill.rx-lila { color: var(--lila-deep); background: var(--lila-soft); }
    .rx-off { color: var(--ink-2); }
    /* Variación contra otro período. */
    .rx-dl { display: inline-flex; align-self: flex-start; padding: 1px 7px; border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--sunk); color: var(--ink-2); }
    .rx-dl.up { background: var(--durazno-bg); color: var(--durazno-fg); }
    .rx-dl.dn { background: var(--menta-bg); color: var(--menta-fg); }
    /* Iniciales del proveedor. */
    .rx-av { width: 34px; height: 34px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-size: .72rem; font-weight: 700; letter-spacing: .01em; }
    .rx-av0 { background: var(--lila-soft); color: var(--lila-deep); } .rx-av1 { background: var(--menta-bg); color: var(--menta-fg); }
    .rx-av2 { background: var(--durazno-bg); color: var(--durazno-fg); } .rx-av3 { background: var(--rosa-bg); color: var(--rosa-fg); }
    .rx-av4 { background: #DDEDFF; color: #1E5A94; }

    /* ---- Grilla: en el celular, una columna ---- */
    .rx-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; }
    .rx-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    .rx-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem;
      display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
    @media (min-width: 1000px) {
      .rx { padding: 1.5rem 1.75rem 3rem; }
      .rx-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 1.1rem; }
      .rx-c7 { grid-column: span 7; } .rx-c5 { grid-column: span 5; } .rx-c4 { grid-column: span 4; } .rx-c8 { grid-column: span 8; } .rx-c6 { grid-column: span 6; }
    }
    .rx-empty { color: var(--ink-2); font-size: .88rem; padding: .5rem 0; }

    /* ---- Gráficos de área: van en %, se tocan por columnas ---- */
    .rx-chart { position: relative; }
    .rx-chart svg { display: block; overflow: visible; touch-action: pan-y; }
    .rx-chart svg text { fill: var(--ink-2); font-family: var(--font-texto); font-size: 11px; }
    .rx-tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 11px; font-size: .82rem; box-shadow: 0 8px 24px -10px rgba(26,58,92,.35); min-width: 180px; z-index: 3; }
    .rx-tip b { display: block; margin-bottom: 3px; }
    .rx-tip .tr { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
    .rx-tip .tr span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14em; }
    .rx-tip .tt { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; font-weight: 700; }
    .rx-sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: baseline; flex: none; }
    .rx-gr-read { font-size: .84rem; color: var(--ink-2); min-height: 1.2em; margin-bottom: .6rem; }
    .rx-gr-read b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
    .rx-gr-plot { position: relative; height: 136px; }
    @media (min-width: 1000px) { .rx-gr-plot { height: 210px; } }
    .rx-gr-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
    .rx-gr-a { fill-opacity: .24; stroke: none; }
    .rx-gr-l { fill: none; stroke-width: 2px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .rx-gr-g { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
    .rx-gr-top { position: absolute; left: 0; font-size: .7rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .rx-gr-dot { position: absolute; width: 11px; height: 11px; margin: 0 0 -5.5px -5.5px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface); pointer-events: none; }
    .rx-gr-cols { position: absolute; inset: 0; display: flex; }
    .rx-gr-c { flex: 1; min-width: 0; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 6px; }
    .rx-gr-c.on { background: rgba(91,85,168,.09); }
    .rx-gr-x { display: flex; margin-top: 4px; }
    .rx-gr-x span { flex: 1; min-width: 0; display: flex; justify-content: center; }
    .rx-gr-x i { font-style: normal; font-size: .7rem; color: var(--ink-2); white-space: nowrap; }
    .rx-gr-una { display: block; margin-bottom: .2rem; }
    .rx-gr-ley { display: flex; flex-direction: column; gap: 2px; margin-top: .6rem; font-size: .86rem; }
    .rx-gr-ley .rx-muted { display: inline-block; min-width: 2.6em; text-align: right; font-size: .78rem; }

    /* ---- Torta ---- */
    .rx-pie-b { display: grid; grid-template-columns: minmax(0, 1fr); gap: .5rem 1.5rem; align-items: center; }
    @media (min-width: 640px) { .rx-pie-b { grid-template-columns: 190px minmax(0, 1fr); } }
    .rx-pie-w { display: flex; justify-content: center; padding: .25rem 0 .4rem; }
    .rx-pie { position: relative; width: 176px; height: 176px; }
    .rx-pie svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); } /* el círculo arranca a las 3; la torta, a las 12 */
    .rx-pie-a { fill: none; stroke-width: 6.4; cursor: pointer; transition: opacity .15s; }
    .rx-pie-c { position: absolute; inset: 27px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; text-align: center; pointer-events: none; }
    .rx-pie-c b { font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); }
    .rx-pie-c span { font-size: .72rem; line-height: 1.2; color: var(--ink-2); }
    .rx-pie-l { display: flex; flex-direction: column; min-width: 0; }
    .rx-pie-r { display: flex; align-items: center; gap: .55rem; width: 100%; min-height: 44px; padding: 0 8px; border: 1.5px solid transparent; border-radius: 10px; background: none; font: inherit; font-size: .9rem; color: var(--ink); text-align: left; cursor: pointer; }
    .rx-pie-r.sel { border-color: var(--rx-bar); background: var(--sunk); }
    .rx-pie-r .rx-sw { margin: 0; }
    .rx-pie-r .rx-ell { flex: 1; }
    .rx-pie-r small { flex: none; width: 2.7em; text-align: right; font-size: .78rem; color: var(--ink-2); }
    .rx-pie-r:focus-visible, .rx-gr-c:focus-visible, .rx-ocf:focus-visible, .rx-tipr:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }

    .rx-hb:hover { background: var(--sunk); }
    .rx-mas { border: 0; background: none; color: var(--lila-deep); font: inherit; font-size: .84rem; font-weight: 600; cursor: pointer; padding: 4px 8px; text-align: left; }
    .rx-dim { opacity: .35; }

    /* ---- Rankings: por obra, responsable, proveedor y equipo ---- */
    .rx-bars { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
    .rx-hb { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer;
      border: 0; background: none; font: inherit; color: var(--ink); text-align: left; width: 100%; }
    .rx-hb > .rx-row, .rx-hb > .tr2 { flex: 1 0 100%; }
    .rx-hb-m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .rx-hb .rx-row { font-size: .88rem; }
    .rx-hb .rx-row > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rx-hb .rx-row > span:last-child { flex: none; }
    .rx-hb .tr2 { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
    .rx-hb .tr2 i { display: block; height: 100%; background: var(--rx-bar); border-radius: 0 3px 3px 0; }
    .rx-hb .por { display: inline-block; min-width: 2.6em; text-align: right; font-weight: 700; }
    .rx-cats { display: flex; flex-wrap: wrap; gap: .4rem; }

    /* ---- Todas las OC: tabla en escritorio, tarjetas en el celular ---- */
    .rx-buscar { display: flex; gap: .5rem; }
    .rx-qw { position: relative; }
    .rx-qw .icon { position: absolute; left: .75rem; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--ink-2); pointer-events: none; }
    .rx .rx-q { width: 100%; min-height: 44px; box-sizing: border-box; padding-left: 2.4rem; }
    .rx mark.hl { background: var(--durazno-bg); color: inherit; border-radius: 3px; padding: 0 1px; }
    .rx-co-sw { width: 34px; flex: none; display: flex; justify-content: center; }
    .rx-co-sw .rx-sw { margin: 0; }
    @media (min-width: 761px) { .rx-buscar { display: none; } }
    /* ---- Precios de lo buscado ---- */
    .rx-pr-h { padding: 0 2px; flex-wrap: wrap; gap: 0 .75rem; }
    .rx-pr-h .rx-muted { font-size: .78rem; }
    .rx-pr-f { margin: 0; font-size: .92rem; line-height: 1.4; color: var(--ink); text-wrap: pretty; }
    .rx-pr-ps { display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; }
    .rx-prr { display: flex; align-items: center; gap: .55rem; width: 100%; min-height: 48px; padding: .4rem 8px; min-width: 0; border: 1.5px solid transparent; border-radius: 10px; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
    .rx-prr.sel { border-color: var(--rx-bar); background: var(--sunk); }
    .rx-prr:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }
    .rx-prr .rx-l { flex: 1; }
    .rx-prr b { font-weight: 600; font-size: .92rem; }
    .rx-prr .rx-muted { font-size: .78rem; }
    .rx-pr-plot { position: relative; height: 120px; margin: 1.1rem 0 1rem; }
    .rx-pr-l { fill: none; stroke: var(--otros); stroke-width: 1.25px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .6; }
    .rx-pr-l.on { stroke: var(--rx-bar); stroke-width: 2.25px; opacity: 1; }
    .rx-pr-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
    .rx-pr-dot { position: absolute; width: 5px; height: 5px; margin: 0 0 -2.5px -2.5px; border-radius: 50%; background: var(--otros); opacity: .7; pointer-events: none; }
    .rx-pr-dot.on { width: 8px; height: 8px; margin: 0 0 -5.5px -5.5px; background: var(--rx-bar); border: 1.5px solid var(--surface); box-sizing: content-box; opacity: 1; }
    .rx-prc { width: 100%; margin: 0; padding: .4rem 0; align-items: center; border-radius: 0; }
    .rx-inp { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px;
      padding: .55rem .75rem; font: inherit; font-size: .92rem; }
    .rx-inp:focus { outline: 2px solid var(--lila); outline-offset: 1px; }
    .rx-sel { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: .5rem .6rem; font: inherit; font-size: .88rem; }
    table.rx-oc { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .88rem; }
    table.rx-oc th { text-align: left; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600;
      padding: 6px 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
    table.rx-oc th[data-sort] { cursor: pointer; }
    table.rx-oc th[data-sort]:hover { color: var(--ink); }
    table.rx-oc td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--ink); }
    table.rx-oc tbody tr:last-child td { border-bottom: 0; }
    table.rx-oc tbody tr { cursor: pointer; }
    table.rx-oc tbody tr:hover td, table.rx-oc tbody tr:focus-visible td { background: var(--sunk); }
    table.rx-oc tbody tr:focus-visible { outline: none; }
    table.rx-oc .r { text-align: right; }
    table.rx-oc .prov { font-weight: 600; }
    .rx-ocw { display: flex; align-items: flex-start; gap: .6rem; min-width: 0; }
    .rx-ocw > div { min-width: 0; }
    .rx-imp-p { margin-top: 4px; }
    table.rx-oc .sub { color: var(--ink-2); font-size: .79rem; margin-top: 2px; }
    table.rx-oc .c-prov .sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    table.rx-oc .pu { font-size: .8rem; font-weight: 650; margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    table.rx-oc .c-obra { max-width: 240px; }
    .rx-l .rx-sw, table.rx-oc .c-obra .rx-sw, .rx-h3o .rx-sw, .rx-fhead .rx-sw { width: 9px; height: 9px; margin-right: 6px; }
    table.rx-oc .c-resp { color: var(--ink-2); white-space: nowrap; }
    table.rx-oc .c-nro { white-space: nowrap; }
    table.rx-oc .fch { font-weight: 600; }
    table.rx-oc .nro { font-variant-numeric: tabular-nums; letter-spacing: .01em; white-space: nowrap; }
    table.rx-oc .c-imp b { font-weight: 700; white-space: nowrap; }
    table.rx-oc mark { background: var(--durazno-bg); color: inherit; border-radius: 3px; padding: 0 1px; }
    /* Categoría de la obra: los mismos tonos que la pantalla Obras */
    .rx-cat { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
    .rx-cat .icon { width: 17px; height: 17px; }
    .rx-cat--arquitectura { background: #fdf0dc; color: #8a5a0b; }
    .rx-cat--vial         { background: #e8eefc; color: #2c4fa8; }
    .rx-cat--oficina      { background: #efebfd; color: #5a45a8; }
    .rx-cat--sin          { background: var(--gris-bg); color: var(--otros); }
    .rx-sort-tel { display: none; }
    @media (max-width: 760px) {
      .rx-sort-tel { display: block; }
      table.rx-oc thead { display: none; }
      table.rx-oc, table.rx-oc tbody { display: block; }
      table.rx-oc tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: .7rem; row-gap: 1px;
        padding: 12px 2px; border-bottom: 1px solid var(--line); border-radius: 0; }
      table.rx-oc tbody tr:last-child { border-bottom: 0; }
      table.rx-oc td { display: block; padding: 0; border: 0; }
      table.rx-oc td.c-prov { grid-column: 1; grid-row: 1; }
      table.rx-oc td.c-imp  { grid-column: 2; grid-row: 1; }
      table.rx-oc td.c-obra { grid-column: 1; grid-row: 2 / span 2; max-width: none; margin-top: 3px; padding-left: calc(34px + .6rem); font-size: .84rem; }
      table.rx-oc td.c-nro  { display: contents; }
      table.rx-oc td.c-nro .fch { grid-column: 2; grid-row: 2; text-align: right; margin-top: 3px; font-size: .8rem; color: var(--ink-2); font-weight: 600; }
      table.rx-oc td.c-nro .nro { grid-column: 2; grid-row: 3; text-align: right; margin: 0; font-size: .74rem; }
      table.rx-oc td.c-resp { display: none; }
      table.rx-oc tbody tr:hover td { background: none; }
    }
    .rx-foot { font-size: .78rem; color: var(--ink-2); }
    .rx-pdf { margin-left: auto; }

    /* ===== Pestañas (paso 3) ===== */
    .rx-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .25rem 2rem; border-bottom: 1px solid var(--line); }
    .rx-top[hidden] { display: none; }
    .rx-tabs { display: flex; gap: 4px; }
    .rx-tabs[hidden] { display: none; }
    .rx-tabs button { border: 0; background: none; font: inherit; font-weight: 600; color: var(--ink-2); padding: .6rem 1rem .7rem;
      cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
    .rx-tabs button:hover { color: var(--ink); }
    .rx-tabs button[aria-selected="true"] { color: var(--lila-deep); border-bottom-color: var(--lila-deep); }
    @media (max-width: 640px) { .rx-top { gap: 0; } .rx-tabs { width: 100%; } .rx-tabs button { flex: 1; } }

    /* ===== Obras y ficha de obra (paso 3) ===== */
    .rx-bad  { color: var(--rosa-fg); }
    .rx-lila { color: var(--lila-deep); }

    .rx-go { cursor: pointer; transition: border-color .15s; }

    .rx-go:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }
    .rx-chip2 { border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 999px; padding: .3rem .7rem;

    .rx-track { position: relative; height: 6px; background: var(--sunk); border-radius: 3px; }

    .rx-crumbs { display: flex; gap: .5rem; align-items: center; color: var(--ink-2); font-size: .88rem; min-width: 0; }
    .rx-crumbs button { border: 0; background: none; color: var(--lila-deep); font: inherit; font-weight: 600; cursor: pointer; padding: 0; white-space: nowrap; }
    .rx-fhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .75rem 1.25rem; }

    .rx-list { display: flex; flex-direction: column; }

    .rx-li { padding: .5rem 0; font-size: .9rem; }
    .rx-rbs { display: flex; flex-direction: column; gap: 4px; }
    .rx-rb { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px; border: 1.5px solid transparent;
      background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; width: 100%; }
    .rx-rb:hover { background: var(--sunk); }
    .rx-rb.sel { border-color: var(--rx-bar); }
    .rx-rb .rx-row { font-size: .92rem; }
    /* Rubro de la ficha: el presupuesto es la pista; lo gastado va arriba, y lo pasado en rosa. */
    .rx-rbar { position: relative; height: 8px; display: block; }
    .rx-rbar > span { position: absolute; display: block; top: 0; bottom: 0; }
    .rx-rbar .bud { left: 0; background: var(--sunk); border-radius: 3px; }

    .rx-ley2 { font-size: .78rem; white-space: nowrap; }
    .rx-panel, .rx-arriba { align-self: start; }

    .rx-ocr { display: flex; flex-direction: column; gap: .45rem; padding: .55rem 0; }

    .rx-modal { max-width: 560px; }
    .rx-mh { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
    .rx-mh h2 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--ink); margin: .1rem 0 0; }
    .rx-x { border: 0; background: var(--sunk); color: var(--ink); width: 32px; height: 32px; border-radius: 9px; cursor: pointer; flex: none;

    #rx-mb { display: flex; flex-direction: column; gap: .75rem; overflow: auto; }
    #rx-mf { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
    #rx-mf.hidden { display: none; }
    .rx-cargando { color: var(--ink-2); padding: 2rem 0; text-align: center; }
    button:focus-visible, [data-f]:focus-visible, th[data-sort]:focus-visible, tr[data-oc]:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }
    @media (min-width: 1000px) { .rx-c12 { grid-column: 1 / -1; } }
    /* ---- Comprado, OC y promedio ---- */
    .rx-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .rx-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 10px; display: flex; flex-direction: column; gap: 5px; min-width: 0; color: var(--ink); }
    .rx-kpi .k { font-size: .76rem; color: var(--ink-2); }

    @media (min-width: 1000px) { .rx-kpi { padding: .9rem 1.1rem; } .rx-kpi .v { font-size: 1.45rem; } }

    @media (min-width: 1000px) { .rx-per { align-self: flex-start; } .rx-per button { padding: 0 1rem; } }

    .rx-tot-l { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    /* ---- Sin ninguna OC ---- */
    .rx-vac { align-items: center; gap: 10px; padding: 44px 18px; text-align: center; }

    .rx-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 8px; padding: 0 16px; border-radius: 11px; background: var(--ink); color: #fff; font-weight: 600; font-size: .88rem; text-decoration: none; }
    /* ---- Cargando: la forma de la pantalla ---- */
    .rx-sk { display: block; border-radius: 7px; background: linear-gradient(90deg, var(--sunk) 25%, var(--surface) 50%, var(--sunk) 75%); background-size: 300% 100%; animation: rx-sk 1.5s ease-in-out infinite; }
    @keyframes rx-sk { from { background-position: 100% 0; } to { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) { .rx-sk { animation: none; background: var(--sunk); } }
    .rx-sk-f { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
    .rx-sk-c { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    /* ===== Resumen (paso 5) ===== */
    .rx-lead { font-size: 1.02rem; line-height: 1.42; color: var(--ink); margin: 0; max-width: 62ch; text-wrap: pretty; }

    .rx-mirar { display: flex; flex-direction: column; gap: .5rem; padding-top: .75rem; border-top: 1px solid var(--line); }
    .rx-poco { margin: 0; line-height: 1.4; text-wrap: pretty; }
    .rx-tipr { display: flex; align-items: center; gap: .6rem; width: 100%; min-height: 44px; padding: .7rem .8rem; border-radius: 14px; font: inherit; font-size: .84rem; line-height: 1.4; color: var(--ink); text-align: left; cursor: pointer;
      border: 1px solid rgba(139,124,246,.38); background: rgba(139,124,246,.1); }

    .rx-ocf { display: flex; align-items: center; gap: .6rem; width: 100%; padding: .6rem 0; border: 0; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }

    .rx-ocf .rx-l { flex: 1; }
    .rx-ocf b { font-weight: 600; font-size: .92rem; }
    .rx-ocf .rx-muted { font-size: .8rem; }
    .rx-ocf-r { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
    .rx-alert { display: flex; gap: .85rem; align-items: flex-start; padding: .75rem .6rem; border: 0; background: none; font: inherit;
      color: var(--ink); text-align: left; cursor: pointer; width: 100%; border-radius: 8px; }
    .rx-alert:hover { background: var(--sunk); }
    .rx-alert:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }
    .rx-alert .t { font-weight: 600; font-size: .92rem; line-height: 1.35; }

    .rx-psvg { display: block; }
