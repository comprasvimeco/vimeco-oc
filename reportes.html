<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO S.A. — Reportes</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    /* ===== Reportes (rediseño traído de Leva) =====
       Todo color sale de un token, con los tonos de VIMECO. Las obras de los
       gráficos: las cuatro que más gastaron, con colores distinguibles para
       daltonismo; el resto, «Otras» en gris. */
    body.rx-page {
      --ink: #1a3a5c; --ink-2: #64708a; --surface: #ffffff; --sunk: #f1f4f9; --line: #e2e7ef;
      --lila: #2557a7; --lila-deep: #234870; --lila-soft: #e3ecf8;
      --menta-bg: #ddf5e8; --menta-fg: #1d6b45; --durazno-bg: #ffe7d6; --durazno-fg: #9a4a16; --rosa-bg: #fbe1e6; --rosa-fg: #a0283e;
      --shadow-leva: 0 1px 2px rgba(26,58,92,.06), 0 8px 22px -12px rgba(26,58,92,.28);
      --font-display: 'Segoe UI', system-ui, -apple-system, sans-serif; --font-texto: var(--font-display);
      --s1: #2557a7; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --otros: #a9b1c2;
      --gris-bg: #eceff4; --gris-fg: #5b6478;
    }
    /* Los botones de la ventana y la ficha, con los tonos de la ficha de OC */
    .foc-btn--sec  { background: var(--gray-100); color: var(--gray-700); }
    .foc-btn--main { background: var(--primary); color: #fff; }
    .foc-btn--oc   { background: #e8eef7; color: var(--primary); }
    .foc-btn--fac  { background: #f1e8fb; color: #6b3fa0; }

    .rx-main { max-width: none; padding: 0; }
    #rx-tabla { overflow-x: auto; }
    .rx { max-width: 1240px; margin: 0 auto; padding: 1.25rem 1rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
    .rx h1 { font-family: var(--font-display); font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; color: var(--ink); margin: 0; }
    .rx h3 { font-family: var(--font-display); font-size: 1.02rem; font-weight: 700; color: var(--ink); margin: 0; }
    .rx-muted { color: var(--ink-2); font-size: .84rem; }
    .rx-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rx-row { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
    .rx-row > * { min-width: 0; }

    /* ---- Cabecera: período, mes, filtros y el total ---- */
    .rx-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.25rem; }
    .rx-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
    .rx-seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; gap: 3px; }
    .rx-seg button { border: 0; background: none; color: var(--ink-2); font: inherit; font-size: .86rem; font-weight: 600;
      padding: .4rem .85rem; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .rx-seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(26,58,92,.14); }
    .rx-mes { display: flex; align-items: center; gap: .5rem; }
    .rx-mes button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 32px; height: 32px;
      border-radius: 9px; font-size: 1.15rem; line-height: 1; cursor: pointer; }
    .rx-mes button:disabled { opacity: .35; cursor: default; }
    .rx-mes b { font-family: var(--font-display); min-width: 8.5em; text-align: center; color: var(--ink); }
    .rx-chip { display: inline-flex; align-items: center; gap: .35rem; border: 0; border-radius: 999px; padding: .32rem .75rem;
      background: var(--lila-deep); color: #fff; font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; max-width: 100%; }
    .rx-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rx-tot { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
    .rx-tot .v { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
    .rx-pill { display: inline-flex; align-items: center; border-radius: 999px; padding: .14rem .6rem; font-size: .76rem; font-weight: 600; white-space: nowrap; }
    .rx-ok   { background: var(--menta-bg); color: var(--menta-fg); }
    .rx-warn { background: var(--durazno-bg); color: var(--durazno-fg); }
    .rx-off  { background: var(--gris-bg); color: var(--gris-fg); }

    /* ---- Grilla: en el celular, una columna ---- */
    .rx-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; align-items: start; }
    .rx-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    .rx-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem;
      box-shadow: var(--shadow-leva); display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
    @media (min-width: 1000px) {
      .rx { padding: 1.5rem 1.75rem 3rem; }
      .rx-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 1.1rem; }
      .rx-c7 { grid-column: span 7; } .rx-c5 { grid-column: span 5; } .rx-c4 { grid-column: span 4; } .rx-c8 { grid-column: span 8; }
    }
    .rx-empty { color: var(--ink-2); font-size: .88rem; padding: .5rem 0; }

    /* ---- Acumulado por semana ---- */
    .rx-chart { position: relative; }
    .rx-chart svg { display: block; overflow: visible; touch-action: pan-y; }
    .rx-chart svg text { fill: var(--ink-2); font-family: var(--font-texto); font-size: 11px; }
    .rx-tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 11px; font-size: .82rem; box-shadow: 0 8px 24px -10px rgba(26,58,92,.35); min-width: 180px; z-index: 3; }
    .rx-tip b { display: block; margin-bottom: 3px; }
    .rx-tip .tr { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
    .rx-tip .tr span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14em; }
    .rx-tip .tt { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; font-weight: 700; }
    .rx-sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: baseline; flex: none; }
    .rx-ley { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .8rem; color: var(--ink); }

    /* ---- Torta por obra ---- */
    .rx-donut { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 1rem; align-items: center; }
    .rx-donut svg path { cursor: pointer; }
    @media (max-width: 420px) { .rx-donut { grid-template-columns: minmax(0, 1fr); justify-items: center; } .rx-donut .rx-lg { width: 100%; } }
    .rx-lg { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rx-it { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .75rem; padding: 6px 8px; border-radius: 8px;
      font-size: .88rem; align-items: baseline; cursor: pointer; border: 0; background: none; font-family: inherit; color: var(--ink); text-align: left; }
    .rx-it .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rx-it:hover, .rx-hb:hover { background: var(--sunk); }
    .rx-mas { border: 0; background: none; color: var(--lila-deep); font: inherit; font-size: .84rem; font-weight: 600; cursor: pointer; padding: 4px 8px; text-align: left; }
    .rx-dim { opacity: .35; }

    /* ---- Barras por responsable / equipo ---- */
    .rx-bars { display: flex; flex-direction: column; gap: 2px; }
    .rx-hb { display: flex; flex-direction: column; gap: 5px; padding: 7px 8px; border-radius: 8px; cursor: pointer;
      border: 0; background: none; font: inherit; color: var(--ink); text-align: left; width: 100%; }
    .rx-hb .rx-row { font-size: .88rem; }
    .rx-hb .rx-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rx-hb .tr2 { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
    .rx-hb .tr2 i { display: block; height: 100%; background: var(--lila); border-radius: 0 4px 4px 0; }
    .rx-hb.eq .tr2 i { background: var(--s3); }
    .rx-cats { display: flex; flex-wrap: wrap; gap: .4rem; }

    /* ---- Todas las OC: tabla en escritorio, tarjetas en el celular ---- */
    .rx-buscar { display: flex; gap: .5rem; }
    .rx-inp { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px;
      padding: .55rem .75rem; font: inherit; font-size: .92rem; }
    .rx-inp:focus { outline: 2px solid var(--lila); outline-offset: 1px; }
    .rx-sel { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: .5rem .6rem; font: inherit; font-size: .88rem; }
    table.rx-oc { width: 100%; border-collapse: collapse; font-size: .88rem; }
    table.rx-oc th { text-align: left; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); font-weight: 600;
      padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
    table.rx-oc th[data-sort] { cursor: pointer; }
    table.rx-oc th[data-sort]:hover { color: var(--ink); }
    table.rx-oc td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); }
    table.rx-oc tbody tr { cursor: pointer; }
    table.rx-oc tbody tr:hover td { background: var(--sunk); }
    table.rx-oc .r { text-align: right; }
    table.rx-oc .sub { color: var(--ink-2); font-size: .8rem; margin-top: 1px; }
    table.rx-oc .nro { font-weight: 700; white-space: nowrap; }
    table.rx-oc mark { background: var(--durazno-bg); color: inherit; border-radius: 3px; padding: 0 1px; }
    .rx-sort-tel { display: none; }
    @media (max-width: 760px) {
      .rx-sort-tel { display: block; }
      table.rx-oc thead { display: none; }
      table.rx-oc, table.rx-oc tbody { display: block; }
      table.rx-oc tbody tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px .75rem; padding: 10px 4px;
        border-bottom: 1px solid var(--line); }
      table.rx-oc td { display: block; padding: 0; border: 0; }
      table.rx-oc td.c-prov { grid-column: 1; grid-row: 1; font-weight: 600; }
      table.rx-oc td.c-imp  { grid-column: 2; grid-row: 1; }
      table.rx-oc td.c-obra { grid-column: 1; grid-row: 2; }
      table.rx-oc td.c-fac  { grid-column: 2; grid-row: 2; text-align: right; }
      table.rx-oc td.c-nro  { grid-column: 1 / -1; grid-row: 3; color: var(--ink-2); font-size: .8rem; }
      table.rx-oc td.c-nro .sub, table.rx-oc td.c-nro .nro { display: inline; font-weight: 600; }
      table.rx-oc td.c-nro .sub::before { content: ' · '; }
      table.rx-oc td.c-resp { display: none; }
      table.rx-oc tbody tr:hover td { background: none; }
    }
    .rx-foot { font-size: .78rem; color: var(--ink-2); }
    .rx-pdf { margin-left: auto; }

    /* ===== Pestañas (paso 3) ===== */
    .rx-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .25rem 2rem; border-bottom: 1px solid var(--line); }
    .rx-top[hidden] { display: none; }
    .rx-top h1 { padding-bottom: .6rem; }
    .rx-tabs { display: flex; gap: 4px; }
    .rx-tabs[hidden] { display: none; }
    .rx-tabs button { border: 0; background: none; font: inherit; font-weight: 600; color: var(--ink-2); padding: .6rem 1rem .7rem;
      cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; }
    .rx-tabs button:hover { color: var(--ink); }
    .rx-tabs button[aria-selected="true"] { color: var(--lila-deep); border-bottom-color: var(--lila-deep); }
    @media (max-width: 640px) { .rx-top { gap: 0; } .rx-tabs { width: 100%; } .rx-tabs button { flex: 1; } }

    /* ===== Obras y ficha de obra (paso 3) ===== */
    .rx-bad  { background: var(--rosa-bg); color: var(--rosa-fg); }
    .rx-lila { background: var(--lila-soft); color: var(--lila-deep); }
    @media (min-width: 1000px) { .rx-c6 { grid-column: span 6; } }
    .rx-l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .rx-ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .rx-ell2 { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rx-k { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
    .rx-mid { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rx-big { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; letter-spacing: -.02em; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
    .rx-big2 { font-size: 1.7rem; }
    @media (max-width: 520px) { .rx-big { font-size: 1.75rem; } .rx-big2 { font-size: 1.5rem; } }
    .rx .rx-h3o { font-size: 1.12rem; }
    .rx-frase { font-size: .92rem; color: var(--ink); }
    .rx-go { cursor: pointer; transition: border-color .15s; }
    .rx-go:hover { border-color: var(--lila); }
    .rx-go:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }
    .rx-chip2 { border: 1px solid var(--line); background: var(--sunk); color: var(--ink); border-radius: 999px; padding: .3rem .7rem;
      font: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; }
    .rx-chip2:hover:not(:disabled) { border-color: var(--lila); }
    .rx-chip2:disabled { opacity: .45; cursor: default; }
    .rx-track { position: relative; height: 10px; background: var(--sunk); border-radius: 6px; }
    .rx-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--lila); }
    .rx-track b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 2px; }
    .rx-legend { display: flex; justify-content: space-between; gap: .75rem; font-size: .78rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .rx-crumbs { display: flex; gap: .5rem; align-items: center; color: var(--ink-2); font-size: .88rem; min-width: 0; }
    .rx-crumbs button { border: 0; background: none; color: var(--lila-deep); font: inherit; font-weight: 600; cursor: pointer; padding: 0; white-space: nowrap; }
    .rx-fhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .75rem 1.25rem; }
    .rx .rx-fhead h1 { font-size: 1.8rem; overflow-wrap: anywhere; }
    .rx-list { display: flex; flex-direction: column; }
    .rx-list > * + * { border-top: 1px solid var(--line); }
    .rx-li { padding: .5rem 0; font-size: .9rem; }
    .rx-rbs { display: flex; flex-direction: column; gap: 4px; }
    .rx-rb { display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 10px; border: 1.5px solid transparent;
      background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; width: 100%; }
    .rx-rb:hover { background: var(--sunk); }
    .rx-rb.sel { border-color: var(--lila); background: var(--sunk); }
    .rx-rb .rx-row { font-size: .92rem; }
    .rx-rbar { position: relative; height: 14px; display: block; }
    .rx-rbar > span { position: absolute; display: block; }
    .rx-rbar .bud { top: 0; bottom: 0; left: 0; border: 1.5px dashed var(--ink-2); border-radius: 4px; opacity: .55; }
    .rx-rbar .g { top: 2px; bottom: 2px; left: 0; background: var(--lila); border-radius: 3px; min-width: 2px; }
    .rx-rbar .g.solo { background: var(--otros); }
    .rx-rbar .g.sin { background: repeating-linear-gradient(45deg, var(--otros) 0 4px, transparent 4px 7px); }
    .rx-rbar .ov { top: 2px; bottom: 2px; background: var(--rosa-fg); border-radius: 0 3px 3px 0; }
    .rx-ley2 { font-size: .78rem; white-space: nowrap; }
    @media (min-width: 1000px) { .rx-panel { position: sticky; top: 12px; } }
    .rx-ocr { display: flex; flex-direction: column; gap: .45rem; padding: .55rem 0; }
    .rx-ocb { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; border: 0; background: none; font: inherit;
      color: var(--ink); text-align: left; cursor: pointer; padding: .15rem .3rem; margin: 0 -.3rem; border-radius: 8px; font-size: .9rem; }
    .rx-ocb:hover { background: var(--sunk); }
    .rx-ocb .rx-num { font-weight: 600; }
    .rx-mgrp { display: flex; flex-direction: column; gap: .25rem; }
    .rx-mgrp + .rx-mgrp { margin-top: .75rem; }
    .rx-modal { max-width: 560px; }
    .rx-mh { display: flex; justify-content: space-between; align-items: flex-start; gap: .75rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); }
    .rx-mh h2 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; color: var(--ink); margin: .1rem 0 0; }
    .rx-x { border: 0; background: var(--sunk); color: var(--ink); width: 32px; height: 32px; border-radius: 9px; cursor: pointer; flex: none;
      display: inline-flex; align-items: center; justify-content: center; }
    .rx-x .icon { width: 16px; height: 16px; }
    #rx-mb { display: flex; flex-direction: column; gap: .75rem; overflow: auto; }
    #rx-mf { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
    #rx-mf.hidden { display: none; }
    .rx-cargando { color: var(--ink-2); padding: 2rem 0; text-align: center; }
    button:focus-visible, [data-f]:focus-visible, th[data-sort]:focus-visible, tr[data-oc]:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }
    /* ===== Tablero (paso 4) ===== */
    @media (min-width: 1000px) { .rx-c12 { grid-column: 1 / -1; } }
    .rx-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
    @media (min-width: 1000px) { .rx-kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.1rem; } }
    .rx-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: .85rem 1rem; box-shadow: var(--shadow-leva);
      display: flex; flex-direction: column; gap: .2rem; min-width: 0; font: inherit; color: var(--ink); text-align: left; }
    .rx-kpi .v { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rx-kpi .rx-muted { font-size: .8rem; }
    @media (max-width: 520px) { .rx-kpi { padding: .7rem .8rem; } .rx-kpi .v { font-size: 1.2rem; } .rx-kpi .rx-k { font-size: .66rem; } }
    .rx-tbcol { cursor: pointer; }
    .rx-tbcol:hover { fill: var(--sunk); }
    #rx-tbm rect:not(.rx-tbcol), #rx-tbm text { pointer-events: none; }
    .rx-tbo { display: flex; flex-direction: column; gap: .35rem; padding: .65rem .4rem; border: 0; background: none; font: inherit; color: var(--ink);
      text-align: left; cursor: pointer; width: 100%; border-radius: 8px; }
    .rx-tbo:hover { background: var(--sunk); }
    .rx-tbo .rx-row { font-size: .9rem; }
    .rx-tbr { display: flex; flex-direction: column; gap: .5rem; }
    .rx .rx-tbn { padding: 0; color: var(--ink); font-size: .95rem; align-self: flex-start; }
    .rx .rx-tbn:hover { color: var(--lila-deep); }
    .rx-mx { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    @media (max-width: 520px) { .rx-mx { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: .4rem; } }
    .rx-cel { border: 0; border-radius: 10px; padding: .6rem .75rem; display: flex; justify-content: space-between; align-items: baseline; gap: .5rem;
      font: inherit; font-weight: 700; cursor: pointer; text-align: left; min-width: 0; }
    .rx-cel .cn { font-size: .8rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rx-cel:hover { filter: brightness(.96); }
    .rx-tbh { flex-wrap: wrap; }
    @media (max-width: 520px) {
      .rx-cel { flex-direction: column; align-items: stretch; gap: 2px; padding: .45rem .55rem; }
      .rx-cel .cn { white-space: normal; overflow-wrap: anywhere; line-height: 1.2; }
      .rx-tbh .rx-cats { width: 100%; }
    }
    .rx-kpi:focus-visible, .rx-cel:focus-visible, .rx-tbo:focus-visible { outline: 2px solid var(--lila); outline-offset: 2px; }
    /* ===== Resumen (paso 5) ===== */
    .rx-intro { display: flex; flex-direction: column; gap: .5rem; padding: .35rem .25rem 0; }
    .rx-lead { font-family: var(--font-display); font-size: 1.28rem; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; color: var(--ink); margin: 0; max-width: 34ch; }
    .rx-lead em { font-style: normal; color: var(--lila-deep); white-space: nowrap; }
    @media (min-width: 1000px) { .rx-lead { font-size: 1.7rem; line-height: 1.28; letter-spacing: -.015em; } }
    .rx-alert { display: flex; gap: .85rem; align-items: flex-start; padding: .75rem .6rem; border: 0; background: none; font: inherit;
      color: var(--ink); text-align: left; cursor: pointer; width: 100%; border-radius: 8px; }

    .rx-psvg { display: block; }
  </style>
