<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO S.A. — Remitos</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VIMECO OC">
</head>
<body>

<header class="app-header">
  <div class="header-brand u-pointer" onclick="window.location.href='menu.html'">
    <img src="assets/logo_claro.png" id="header-logo" alt="VIMECO" class="header-logo"
      onerror="this.style.display='none';document.getElementById('header-logo-fb').style.display='inline'">
    <span id="header-logo-fb" class="header-logo-fallback" style="display:none">VIMECO S.A.</span>
    <span class="header-title">Remitos</span>
  </div>
  <div class="header-user">
    <div class="user-badge">
      <span id="hdr-name">—</span>
    </div>
    <button class="btn btn-sm btn-outline btn-icon" id="btn-back" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
  </div>
</header>

<main class="app-main">
  <div class="adj-page">

    <!-- Entregas: OC contra las que cargar un remito -->
    <div class="card">
      <div class="card-header">
        <span class="card-title"><svg class="icon" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg> Entregas</span>
      </div>
      <div class="card-body">
        <div class="hist-offline-notice hidden" id="rem-sync-warn"></div>
        <div class="rem-tabs" id="rem-filtro">
          <button class="rem-tab active" data-filtro="pendientes">Pendientes</button>
          <button class="rem-tab" data-filtro="todas">Todas</button>
        </div>
        <input type="search" id="rem-search" class="form-control" placeholder="Buscar por artículo, proveedor, obra o N° OC…" style="margin-bottom:.85rem;">
        <div id="rem-oc-list"><div class="hist-empty">Cargando OC…</div></div>
      </div>
    </div>

    <!-- Remitos ya cargados -->
    <div class="card" style="margin-top:1rem;">
      <div class="card-header">
        <span class="card-title"><svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Remitos cargados</span>
        <span class="hist-count" id="rem-count"></span>
      </div>
      <div class="card-body">
        <div id="rem-list"><div class="hist-empty">Cargando remitos…</div></div>
      </div>
    </div>

  </div>
</main>

<!-- ===== MODAL: Cargar remito ===== -->
<div class="modal-overlay hidden" id="modal-remito">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Cargar remito</span>
      <button class="modal-close" id="modal-remito-close">
        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">

      <div class="rem-oc-ref" id="rem-oc-ref"></div>

      <!-- Paso 1: la foto. Es el comprobante y, además, de ella sale el resto
           del formulario cuando se usa "Leer con IA". -->
      <div style="margin-bottom:1.2rem;">
        <label class="rem-section-lbl">Foto del remito <span style="font-weight:400;text-transform:none;color:var(--danger);">(obligatoria)</span></label>
        <input type="file" id="rem-file"   accept=".jpg,.jpeg,.png,.pdf,.webp" style="display:none">
        <input type="file" id="rem-camera" accept="image/*" capture="environment" style="display:none">
        <div class="import-buttons" style="margin-bottom:.5rem;">
          <button type="button" class="btn import-btn" id="btn-rem-archivo">
            <span class="import-btn-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg></span>
            <span class="import-btn-label">Subir archivo</span>
          </button>
          <button type="button" class="btn import-btn" id="btn-rem-camera" style="display:none">
            <span class="import-btn-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
            <span class="import-btn-label">Sacar foto</span>
          </button>
        </div>
        <div id="rem-file-name" class="upload-filename hidden"></div>
        <!-- Preview de la foto escaneada -->
        <div id="rem-preview" class="scan-preview hidden">
          <img id="rem-preview-img" alt="Remito">
          <div class="scan-preview-actions">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-rem-rescan">
              <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
              Escanear
            </button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-rem-quitar">
              <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              Quitar
            </button>
          </div>
        </div>
        <div class="extract-bar">
          <button type="button" class="btn btn-primary" id="btn-rem-ia" disabled>
            <svg class="icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Leer con IA
          </button>
        </div>
        <div id="rem-ia-status" class="extract-status hidden" style="margin-top:.6rem;"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="rem-nro">N° de remito *</label>
          <input type="text" id="rem-nro" class="form-control" placeholder="Ej: 0001-00012345" inputmode="text">
        </div>
        <div class="form-group">
          <label for="rem-fecha">Fecha *</label>
          <input type="date" id="rem-fecha" class="form-control">
        </div>
      </div>

      <label class="rem-section-lbl">
        Cantidades recibidas
        <span class="rem-quick">
          <button type="button" class="btn btn-sm btn-outline" id="btn-rem-todo">Llegó todo</button>
          <button type="button" class="btn btn-sm btn-secondary" id="btn-rem-vaciar">Vaciar</button>
        </span>
      </label>
      <div id="rem-items"></div>

      <div class="form-group" style="margin-top:1.1rem;">
        <label for="rem-obs">Observaciones <span style="font-weight:400;text-transform:none;color:var(--gray-400);">(opcional)</span></label>
        <input type="text" id="rem-obs" class="form-control" placeholder="Ej: bulto dañado, faltó descarga…">
      </div>

      <div id="rem-error" class="alert alert-error hidden"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="btn-rem-cancelar">Cancelar</button>
      <button class="btn btn-success" id="btn-rem-guardar">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Guardar remito
      </button>
    </div>
  </div>
</div>

<!-- ===== MODAL: Confirmar (genérico) ===== -->
<div class="modal-overlay hidden" id="modal-confirm">
  <div class="modal modal--sm">
    <div class="modal-header">
      <span class="modal-title" id="modal-confirm-title">Confirmar</span>
    </div>
    <div class="modal-body" style="text-align:center;padding:1.5rem 1.25rem;">
      <p id="modal-confirm-msg" style="color:var(--gray-600);white-space:pre-line;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-confirm-no">Cancelar</button>
      <button class="btn btn-primary" id="modal-confirm-yes">Aceptar</button>
    </div>
  </div>
</div>

<!-- ===== EDITOR DE ESCANEO ===== -->
<div id="scan-editor" class="scan-editor hidden">
  <div class="scan-area">
    <div class="scan-stage" id="scan-stage">
      <canvas id="scan-canvas"></canvas>
      <canvas id="scan-quad"></canvas>
      <div class="scan-handle" data-corner="tl"></div>
      <div class="scan-handle" data-corner="tr"></div>
      <div class="scan-handle" data-corner="br"></div>
      <div class="scan-handle" data-corner="bl"></div>
    </div>
  </div>
  <div class="scan-loading hidden" id="scan-loading">
    <div class="scan-spinner"></div>
    <span id="scan-loading-text">Cargando escáner…</span>
  </div>
  <div class="scan-toolbar">
    <div class="scan-filters">
      <button type="button" class="scan-chip active" data-filter="color">Color</button>
      <button type="button" class="scan-chip" data-filter="gray">Grises</button>
      <button type="button" class="scan-chip" data-filter="bw">B&amp;N</button>
    </div>
    <div class="scan-actions">
      <button type="button" class="scan-btn" id="scan-rotate" title="Rotar">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
      </button>
      <button type="button" class="scan-btn" id="scan-cancel">Cancelar</button>
      <button type="button" class="scan-btn primary" id="scan-done">
        <svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Listo
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/drive.js"></script>
<script src="js/driveQueue.js"></script>
<script src="js/driveBackup.js"></script>
<script src="js/entregas.js"></script>
<script src="js/gemini.js"></script>
<script src="js/scanner.js"></script>
<script src="js/remitos.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/vimeco-oc/sw.js', { updateViaCache: 'none' })
      .then(reg => reg.update()).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible')
        navigator.serviceWorker.ready.then(reg => reg.update()).catch(() => {});
    });
  }
</script>
</body>
</html>
