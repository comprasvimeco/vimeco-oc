<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIMECO S.A. — Autorizaciones</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="icono_app.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a3a5c">
  <style>
    /* ---- Cabecera: título + pastilla "N para firmar" (como Novedades) ---- */
    .aut-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .9rem; }
    .aut-head h1 { font-size: 1.45rem; font-weight: 700; color: var(--primary-dark); line-height: 1.2; white-space: nowrap; }
    .aut-pend { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .65rem; border-radius: 999px;
      background: #fde6e6; color: #b02a2a; font-size: .76rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .aut-pend::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #d64545; }
    /* ---- Pestañas: barra de pastillas, la elegida en el violeta de Autorizaciones ---- */
    .aut-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem; background: var(--white); border-radius: 999px;
      padding: .25rem; margin-bottom: .9rem; box-shadow: 0 1px 2px rgba(26,58,92,.08); }
    .aut-tab { border: none; background: transparent; border-radius: 999px; padding: .5rem .3rem; font-size: .84rem; font-weight: 700;
      color: var(--gray-600); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: .35rem; white-space: nowrap; }
    .aut-tab.active { background: #f1e8fb; color: #6b3fa0; }
    .aut-tab-n { background: #fde6e6; color: #b02a2a; font-size: .7rem; padding: 0 .42rem; border-radius: 999px; line-height: 1.55; font-variant-numeric: tabular-nums; }
    @media (max-width: 400px) { .aut-tab { font-size: .78rem; } }
    /* ---- Tarjeta ---- */
    .aut-card-top { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .aut-nro { font-size: .78rem; color: var(--gray-500); font-weight: 600; font-variant-numeric: tabular-nums; }
    .aut-prov { font-weight: 700; color: var(--primary-dark); font-size: .98rem; margin-top: .2rem; }
    .aut-obra { color: var(--gray-500); font-size: .84rem; }
    .aut-bottom { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; margin-top: .5rem; }
    .aut-total { font-weight: 800; color: var(--gray-700); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .aut-meta { color: var(--gray-500); font-size: .8rem; }
    .aut-card-note { color: var(--gray-500); font-size: .8rem; margin-top: .35rem; }
    .aut-motivo { color: #b02a2a; background: #fdf3f3; border-radius: 8px; padding: .35rem .55rem; font-size: .82rem; margin-top: .5rem; overflow-wrap: anywhere; }
    .aut-actions { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .7rem; padding-top: .65rem; border-top: 1px solid var(--gray-200); }
    .aut-actions .foc-btn { font-size: .78rem; padding: .4rem .8rem; }
    /* Estado del pedido: pastilla con ícono */
    .aut-estado { display: inline-flex; align-items: center; gap: .3rem; padding: .14rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .aut-estado .icon { width: 12px; height: 12px; }
    .aut-estado-espera { background: #fbeedd; color: #8a4f0d; }
    .aut-estado-aprob  { background: #dff3e5; color: #1a7f3c; }
    .aut-estado-rech   { background: #fde6e6; color: #b02a2a; }
    .aut-estado-canc   { background: #eceef1; color: #5b6573; }
    /* Lista vacía: ícono en pastilla violeta */
    .aut-empty { text-align: center; color: var(--gray-500); padding: 2.5rem 1rem; font-size: .92rem; }
    .aut-empty-ic { width: 52px; height: 52px; border-radius: 15px; background: #f1e8fb; color: #6b3fa0; display: grid; place-items: center; margin: 0 auto .7rem; }
    .aut-empty-ic .icon { width: 24px; height: 24px; }
    /* ---- Modales Firma y Rechazar: sobre la confirmación común (.confirm-box en styles.css) ---- */
    .aut-motivo-input { width: 100%; margin-top: .9rem; border: 1.5px solid var(--gray-200); border-radius: 12px; padding: .6rem .75rem;
      font: inherit; font-size: .9rem; color: var(--gray-700); resize: vertical; min-height: 80px; text-align: left; background: var(--gray-100); }
    .aut-motivo-input:focus { outline: none; border-color: #f0b4b4; background: #fff; box-shadow: 0 0 0 3px #fde6e6; }
    /* Pie de la ficha: con cuatro pastillas, en el celular pasa a dos renglones. */
    #modal-preview .foc-foot { flex-wrap: wrap; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-brand u-pointer" onclick="window.location.href='menu.html'">
    <img src="assets/logo_claro.png" id="header-logo" alt="VIMECO" class="header-logo"
      onerror="this.style.display='none';document.getElementById('header-logo-fb').style.display='inline'">
    <span id="header-logo-fb" class="header-logo-fallback" style="display:none">VIMECO S.A.</span>
    <span class="header-title">Autorizaciones</span>
  </div>
  <div class="header-user">
    <div class="user-badge">
      <span id="hdr-name">—</span>
    </div>
    <button class="btn btn-sm btn-outline btn-icon" id="btn-back" aria-label="Volver" title="Volver"><svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
  </div>
</header>

<main class="app-main">
  <div class="hist-page">
    <div class="aut-head">
      <h1>Autorizaciones</h1>
      <span class="aut-pend hidden" id="aut-pend"></span>
    </div>
    <div class="aut-tabs" role="tablist">
      <button class="aut-tab active" id="tab-firmar" data-tab="firmar" role="tab">Para firmar <span class="aut-tab-n hidden" id="n-firmar"></span></button>
      <button class="aut-tab" id="tab-pedidos" data-tab="pedidos" role="tab">Mis pedidos <span class="aut-tab-n hidden" id="n-pedidos"></span></button>
      <button class="aut-tab" id="tab-resueltas" data-tab="resueltas" role="tab">Autorizadas</button>
    </div>

    <div id="pane-firmar">
      <div id="aut-list" class="hist-list">
        <div class="hist-loading">Cargando…</div>
      </div>
    </div>

    <div id="pane-pedidos" class="hidden">
      <div id="ped-list" class="hist-list">
        <div class="hist-loading">Cargando…</div>
      </div>
    </div>

    <div id="pane-resueltas" class="hidden">
      <div id="res-list" class="hist-list">
        <div class="hist-loading">Cargando…</div>
      </div>
    </div>
  </div>
</main>

<!-- ===== MODAL: Vista previa (la misma ficha que la vista previa de la OC) ===== -->
<div class="modal-overlay hidden" id="modal-preview">
  <div class="modal foc-modal">
    <div class="foc-head">
      <div class="foc-head-l">
        <span class="foc-kicker">Orden de compra</span>
        <span class="foc-nro" id="preview-title">—</span>
        <div class="foc-chips" id="preview-chips"></div>
      </div>
      <div class="foc-head-r">
        <span class="foc-kicker">Total</span>
        <span class="foc-total" id="preview-total">—</span>
      </div>
      <button class="foc-x" id="modal-preview-close" aria-label="Cerrar"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="preview-body"></div>
    <div class="modal-footer foc-foot">
      <div class="foc-foot-r">
        <a class="foc-btn foc-btn--pdf" id="preview-pdf" target="_blank" rel="noopener" title="Abrir el PDF de la OC">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>Ver PDF</a>
        <a class="foc-btn foc-btn--drive hidden" id="preview-fuente" target="_blank" rel="noopener" title="Presupuesto o factura que adjuntó el solicitante">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>Presupuesto</a>
      </div>
      <div class="foc-foot-r">
        <button class="foc-btn foc-btn--del" id="preview-rechazar"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Rechazar</button>
        <button class="foc-btn foc-btn--gen" id="preview-firmar"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Firmar</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== MODAL: Firma (mismo formato que la confirmación común, más ancho por el lienzo) ===== -->
<div class="modal-overlay hidden" id="modal-firma">
  <div class="confirm-box confirm-box--ok confirm-box--wide" role="dialog" aria-modal="true" aria-labelledby="firma-title">
    <span class="confirm-ic"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
    <div class="confirm-title" id="firma-title">Tu firma</div>
    <p class="confirm-msg" id="firma-msg">Dibujala para autorizar. Queda guardada para las próximas OC.</p>
    <div class="firma-pad">
      <canvas id="firma-canvas"></canvas>
    </div>
    <div class="firma-pie">
      <span>Con el dedo o el mouse</span>
      <button type="button" class="foc-btn foc-btn--clear" id="btn-firma-limpiar"><svg class="icon" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>Borrar</button>
    </div>
    <div class="confirm-btns">
      <button type="button" class="foc-btn foc-btn--clear" id="modal-firma-close">Cancelar</button>
      <button type="button" class="foc-btn foc-btn--gen" id="btn-firma-guardar"></button>
    </div>
  </div>
</div>

<!-- ===== MODAL: Rechazar ===== -->
<div class="modal-overlay hidden" id="modal-rechazo">
  <div class="confirm-box confirm-box--del" role="dialog" aria-modal="true" aria-labelledby="rechazo-title">
    <span class="confirm-ic"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
    <div class="confirm-title" id="rechazo-title">Rechazar OC</div>
    <p class="confirm-msg" id="rechazo-msg">Contale al solicitante por qué la rechazás (opcional).</p>
    <textarea id="rechazo-motivo" class="aut-motivo-input" rows="3" placeholder="Motivo del rechazo…" aria-label="Motivo del rechazo"></textarea>
    <div class="confirm-btns">
      <button type="button" class="foc-btn foc-btn--clear" id="btn-rechazo-cancel">Cancelar</button>
      <button type="button" class="foc-btn foc-btn--del" id="btn-rechazo-confirm"><svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>Rechazar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/jspdf.umd.min.js"></script>
<script src="js/logoBase64.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase.js"></script>
<script src="js/push.js"></script>
<script src="js/drive.js"></script>
<script src="js/ocGenerator.js"></script>
<script src="js/fichaOC.js"></script>
<script src="js/duplicados.js"></script>
<script src="js/autorizaciones.js"></script>
</body>
</html>
